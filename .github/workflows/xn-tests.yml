name: 测试 XN
run-name: "测试 XN（${{ inputs.mode }}）"

# 一个参数：mode。每个值只做一件事，不再组合 scope / suite / tier。
#
#   all      本仓库离线测试 + 上游全部职能条目（不含 pgo）+ eBPF smoke
#   repo     只跑本仓库离线测试（xn/tests/run-all.sh，几秒）
#   smoke    只跑上游 eBPF smoke 矩阵（5 条 smoke.ebpf.*，几十分钟）
#   nightly  上游 nightly 档（unit + e2e）+ eBPF smoke
#
# PGO 构建 + `pgo.compare` 不在这个 workflow 里：那是发布链路，入口是 `发布 XN`
# （xn.yml）的 `compare` 下拉。这里只保留测试。
#
# 架构固定为 **x86_64 Linux + aarch64 macOS**；上游 ref 固定 main。没有别的输入。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          all=本仓库离线测试+上游全部（不含 pgo）+eBPF |
          repo=只跑本仓库离线测试 | smoke=只跑 eBPF smoke（5 条） |
          nightly=上游 nightly 档+eBPF
        type: choice
        required: true
        default: all
        options:
          - all
          - repo
          - smoke
          - nightly

permissions:
  contents: read

concurrency:
  group: xn-tests-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # sccache 的预编译包要从 GitHub release 下载；CI 上实测 504 重试会卡住
  # `Install sccache`（macOS 靠重试 70s 过关，Linux 卡 30+ 分钟）。测试对编译速度
  # 不敏感：整个 workflow 不套 sccache，换确定性。
  XN_SCCACHE: "off"

jobs:
  repo-tests:
    name: repo tests
    if: inputs.mode == 'all' || inputs.mode == 'repo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run repository test suite
        run: bash ./xn/tests/run-all.sh

  upstream:
    name: upstream (${{ matrix.arch }})
    if: inputs.mode == 'all' || inputs.mode == 'nightly' || inputs.mode == 'smoke'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # mode=smoke 只跑 eBPF smoke，而它只在 Linux 上执行；macOS 那条腿会白起一台
        # runner（checkout / 装 Rust / 打包空日志），所以 smoke 的矩阵只留 Linux。
        include: ${{ fromJSON(inputs.mode == 'smoke'
          && '[{"runner":"ubuntu-24.04","arch":"x86_64"}]'
          || '[{"runner":"ubuntu-24.04","arch":"x86_64"},{"runner":"macos-15","arch":"aarch64"}]') }}
    steps:
      - name: Check XN_REPO_TOKEN
        env:
          TOKEN: ${{ secrets.XN_REPO_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::需要仓库 secret XN_REPO_TOKEN（对 leptonyu/xn 至少 contents:read）"
            exit 1
          fi
      - name: Checkout upstream xn
        uses: actions/checkout@v7
        with:
          repository: leptonyu/xn
          ref: main
          token: ${{ secrets.XN_REPO_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
      - name: Record upstream commit
        run: |
          sha="$(git rev-parse HEAD)"
          {
            echo "### xn-tests"
            echo ""
            echo "- mode: \`${{ inputs.mode }}\` · arch: \`${{ matrix.arch }}\`"
            echo "- commit: \`$sha\` · subject: $(git log -1 --format=%s)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install Rust (rust-toolchain.toml)
        run: |
          toolchain="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          rustup set profile minimal
          rustup toolchain install "$toolchain"
          rustup component add --toolchain "$toolchain" clippy rustfmt
      - name: Install cargo-nextest
        # 只有 unified 档（all / nightly）跑 nextest；smoke 只跑 eBPF，不装。
        if: inputs.mode == 'all' || inputs.mode == 'nightly'
        uses: taiki-e/install-action@nextest
      - name: Check registry and catalog
        run: scripts/test/run.sh check
      - name: Run unified tests
        if: inputs.mode == 'all' || inputs.mode == 'nightly'
        run: |
          set -euo pipefail
          if [ "${{ inputs.mode }}" = "nightly" ]; then suite=nightly; else suite=all; fi
          # 整类都因环境不满足被跳过是 hosted runner 的正常情况（没有 root / VM）；
          # run.sh 退 2 是为了防假绿，这里降级成告警。真正的失败（1）仍然红。
          set +e
          scripts/test/all.sh "$suite" --keep-going
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::warning::$suite 的条目全部因环境不满足被跳过（hosted runner 没有 root/VM）"
            exit 0
          fi
          exit "$code"
      - name: Preserve unified report
        if: always() && (inputs.mode == 'all' || inputs.mode == 'nightly')
        run: |
          if [ -f target/test-runs/last-report.md ]; then
            cp target/test-runs/last-report.md target/test-runs/last-report-unified.md 2>/dev/null || true
          fi
      # eBPF：`ci-ebpf.sh` 按 env:vm-linux 起特权 Alpine 容器，并在宿主准备构建工具链
      # （x86_64 → 原生 cargo + musl-tools + lld；aarch64 / 跨架构才装 zig）。
      - name: eBPF smoke (env:vm-linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        env:
          XN_TEST_ENV: vm-linux
        run: |
          set -euo pipefail
          sudo -E env "PATH=$PATH" "HOME=$HOME" \
            scripts/test/ci-ebpf.sh --category smoke --keep-going
      # eBPF 步骤是 sudo：cargo 会把 target/ 与 .cargo-home/ 写成 root 所有，后面的
      # 非 root 步骤（打包 / 上传）再读同一批目录会 Permission denied。
      - name: Restore workspace ownership after root eBPF step
        if: always() && runner.os == 'Linux'
        run: sudo chown -R "$(id -u):$(id -g)" .cargo-home target 2>/dev/null || true
      - name: Package test logs
        if: always()
        run: |
          set -euo pipefail
          out="xn-test-logs-${{ inputs.mode }}-${{ matrix.arch }}.tar.gz"
          if [ ! -d target/test-runs ]; then
            echo "没有 target/test-runs，跳过打包"
            exit 0
          fi
          # 汇总原文进 job 日志（artifact 之外一眼可见）。
          for report in target/test-runs/last-report.md target/test-runs/last-report-unified.md; do
            [[ -f "$report" ]] || continue
            echo "::group::$report"
            cat "$report"
            echo "::endgroup::"
          done
          tar -czf "$out" \
            --exclude='target/test-runs/*/artifacts' \
            --exclude='target/test-runs/*/artifacts/*' \
            target/test-runs
          du -h "$out"
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xn-test-logs-${{ inputs.mode }}-${{ matrix.arch }}
          path: xn-test-logs-${{ inputs.mode }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: warn
          retention-days: 14
