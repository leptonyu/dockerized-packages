name: Test xn
run-name: "Test xn (${{ inputs.tier != 'none' && inputs.tier || inputs.suite }})"

# 两件事，都在手动触发时跑：
#   - repo tests：跑本仓库的离线测试（xn/tests/run-all.sh，几秒完成）；
#   - upstream：额外 checkout 上游 leptonyu/xn 的最新 commit，用它的 GOAL-111
#     统一测试入口（scripts/test/all.sh）跑完整测试套件。
#     两个下拉：suite（分类）与 tier（档位，none = 按 suite）。`all` 只跑职能分类
#     （unit/smoke/e2e/bench/perf）；pgo 是派生工作流（引用 tests-all 的条目），不进
#     all —— 要跑 PGO 选 suite=pgo。choice 下拉的项数有上限：原来 11 项时 pgo 在 UI 里
#     根本显示不出来，所以拆成 suite（分类）+ tier（档位）两个下拉（各 ≤ 10 项）。
#
# 触发方式和 xn.yml 一致：只用 workflow_dispatch，不在 push / PR 上自动跑。
#
# 这里只跑测试，不构建、不发布；打包仍由 xn.yml 负责（跟踪上游 main）。
# 上游对应本地 ../rust/xn，CI 里用 XN_REPO_TOKEN checkout leptonyu/xn 的 main。
#
# 为什么不自动触发：smoke / e2e / perf / pgo 需要 root、eBPF、VM、perf 等
# 专用环境，自动跑只会制造假红或长时间占用 runner。需要时在
# Actions → xn-tests → Run workflow。
#
# 上游 job 跑在 GitHub-hosted ubuntu-latest；需要 root / eBPF / VM / perf 的
# 条目由 all.sh 按环境记 skip（strict=true 时按 env-error 失败）。私有上游
# 需要仓库 secret XN_REPO_TOKEN（对 leptonyu/xn 至少 contents:read）。

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "统一测试 suite（分类；all = 所有职能条目，pgo 需显式选）"
        type: choice
        required: true
        default: all
        options:
          - all
          - unit
          - smoke
          - e2e
          - bench
          - perf
          - pgo
      tier:
        description: "按 tier 跑（none = 按上面的 suite；选了就忽略 suite 的分类）"
        type: choice
        required: true
        default: none
        options:
          - none
          - pr
          - nightly
          - release
          - manual
      ref:
        description: "上游 ref（留空 = main 的最新 commit）"
        required: false
        default: ""
      keep_going:
        description: "失败后继续跑完（结果仍按最差状态退出）"
        type: boolean
        default: true
      strict:
        description: "缺环境按 env-error 失败（默认 false：记 skip，异地可跑）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: xn-tests-${{ github.ref }}
  # 手动触发的上游套件可能跑几小时，不要被后一次 run 取消。
  cancel-in-progress: false

jobs:
  repo-tests:
    name: repo tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run repository test suite
        run: bash ./xn/tests/run-all.sh

  upstream:
    name: upstream xn suite (${{ matrix.arch }})
    # GOAL-112：x86_64 与 aarch64 各一档。eBPF 条目在 hosted runner 上也能真跑 ——
    # 不是 self-hosted 专属：环境 `env:vm-linux`（Linux 后端 = 特权 Alpine 容器，
    # 定义在 scripts/test/environments.toml），由 scripts/test/ci-ebpf.sh 起容器；
    # 内核用宿主的（BTF + cgroup2 + netns）。
    runs-on: ${{ matrix.runner }}
    # GitHub-hosted 单 job 上限 6h。
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: Check XN_REPO_TOKEN
        env:
          TOKEN: ${{ secrets.XN_REPO_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::需要仓库 secret XN_REPO_TOKEN（对 leptonyu/xn 至少 contents:read）"
            exit 1
          fi

      - name: Checkout upstream xn
        uses: actions/checkout@v7
        with:
          repository: leptonyu/xn
          ref: ${{ inputs.ref || 'main' }}
          token: ${{ secrets.XN_REPO_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record upstream commit
        id: upstream
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "### xn-tests"
            echo ""
            echo "- suite: \`${{ inputs.suite }}\` / tier: \`${{ inputs.tier }}\`"
            echo "- ref: \`${{ inputs.ref || 'main' }}\`"
            echo "- arch: \`${{ matrix.arch }}\`"
            echo "- commit: \`$sha\`"
            echo "- subject: $(git log -1 --format=%s)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust (rust-toolchain.toml)
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          [ -n "$toolchain" ] || { echo "::error::rust-toolchain.toml 里没有 channel"; exit 1; }
          rustup set profile minimal
          rustup toolchain install "$toolchain"
          rustup component add --toolchain "$toolchain" clippy rustfmt

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Check registry and catalog
        run: scripts/test/run.sh check

      - name: Resolve suite
        id: pick
        env:
          SUITE: ${{ inputs.suite }}
          TIER: ${{ inputs.tier }}
        run: |
          set -euo pipefail
          if [ "$TIER" != "none" ]; then
            echo "pick=$TIER" >> "$GITHUB_OUTPUT"
            echo "== 按 tier 跑：$TIER =="
          else
            echo "pick=$SUITE" >> "$GITHUB_OUTPUT"
            echo "== 按分类跑：$SUITE =="
          fi

      # GOAL-112：先只放开 smoke.ebpf.*（最稳的一档）；稳定后再把 --category 换成
      # e2e / unit.ebpf.reload。`ci-ebpf.sh` 按 `env:vm-linux` 起特权 Alpine 容器
      # （镜像 / 包锁在 environments.toml + apk.lock），并在宿主上准备构建工具链：
      #   x86_64 → 原生 cargo + musl-tools + lld（不装 zig）；aarch64 / 跨架构才装 zig。
      # 环境不满足（缺 docker/BTF）时这一步退 2，不静默 skip。
      - name: eBPF smoke (env:vm-linux)
        env:
          PICK: ${{ steps.pick.outputs.pick }}
          XN_TEST_ENV: vm-linux
        run: |
          set -euo pipefail
          case "$PICK" in
            all|nightly|smoke|manual) ;;
            *) echo "pick=$PICK 不含 eBPF 子集，跳过"; exit 0 ;;
          esac
          sudo -E env "PATH=$PATH" "HOME=$HOME" \
            scripts/test/ci-ebpf.sh --category smoke --keep-going

      # eBPF 这一步是 `sudo -E`：cargo 会把 target/ 与 .cargo-home/ 写成 root 所有，
      # 后面的非 root 步骤（unified tests）再写同一批目录会 Permission denied。
      - name: Restore workspace ownership after root eBPF step
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .cargo-home target 2>/dev/null || true

      - name: Run unified tests
        env:
          PICK: ${{ steps.pick.outputs.pick }}
          KEEP_GOING: ${{ inputs.keep_going }}
          STRICT: ${{ inputs.strict }}
        run: |
          set -euo pipefail
          # run --all 不选 pgo（派生工作流）；要跑 PGO 用 suite=pgo。
          args=("$PICK")
          if [ "$KEEP_GOING" != "true" ]; then
            args+=(--fail-fast)
          fi
          if [ "$STRICT" = "true" ]; then
            args+=(--strict)
          fi
          scripts/test/all.sh "${args[@]}"

      - name: Package test logs
        if: always()
        env:
          PICK: ${{ steps.pick.outputs.pick }}
        run: |
          set -euo pipefail
          out="xn-test-logs-${PICK}-${{ matrix.arch }}.tar.gz"
          if [ ! -d target/test-runs ]; then
            echo "没有 target/test-runs，跳过打包"
            exit 0
          fi
          # 只收 result.json / stdout.log / stderr.log；artifacts/ 可能很大，排除。
          tar -czf "$out" \
            --exclude='target/test-runs/*/artifacts' \
            --exclude='target/test-runs/*/artifacts/*' \
            target/test-runs
          du -h "$out"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xn-test-logs-${{ steps.pick.outputs.pick }}-${{ matrix.arch }}
          path: xn-test-logs-${{ steps.pick.outputs.pick }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: warn
          retention-days: 14
