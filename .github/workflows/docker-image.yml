name: Build Docker Image

on:
  push:
    branches-ignore:
    - main
    paths:
      - 'dsh/**'
      - 'code/**'
      - 'obscura/**'
      - 'restic/**'
      - 'tor/**'
      - 'kubectl/**'
  pull_request:
    branches-ignore:
    - main
    paths:
      - 'dsh/**'
      - 'code/**'
      - 'obscura/**'
      - 'restic/**'
      - 'tor/**'
      - 'kubectl/**'

jobs:
  changes:
    name: Get changes
    runs-on: ubuntu-latest
    outputs:
      matrix: "{\"container\": ${{ steps.reduce.outputs.containers }} }"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: json
          base: main
          filters: |
            changed:
            - added|modified:
              - 'dsh/**'
              - 'code/**'
              - 'obscura/**'
              - 'restic/**'
              - 'tor/**'
              - 'kubectl/**'
      - id: reduce
        run: |
          echo '${{ toJson(steps.filter.outputs) }}' | tee changes.json
          CONTAINERS=$(jq -cM --raw-output '.changed_files | fromjson | .[] |= sub("\/.*";"") | unique' changes.json)
          echo ::set-output name=containers::${CONTAINERS}
  build:
    runs-on: ubuntu-latest
    needs:
      - changes
    strategy:
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}
      fail-fast: false
    steps:
    - name: Set up Docker
      uses: docker/setup-docker-action@v5
      with:
        daemon-config: |
          {
            "debug": true,
            "features": {
              "containerd-snapshotter": true
            }
          }
    - name: Check out the repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Get Version
      id: get_ver
      run: |
        case "${{ matrix.container }}" in
          tor)
            RELEASE_VERSION=$(date +%Y%m%d)
            ;;
          dsh)
            # The dsh version is its install argument, not a base image tag: the
            # GitHub release tag without its `dsh-v` prefix. Renovate keeps it
            # current, accepting `-rc.N` and refusing `-alpha.N`.
            RELEASE_VERSION="$(sed -n 's/^ARG DSH_VERSION=//p' ${{ matrix.container }}/Dockerfile | head -n1)"
            ;;
          *)
            RELEASE_VERSION="$(awk -F: '/^FROM /{ver=$2} END{print ver}' ${{ matrix.container }}/Dockerfile)"
            ;;
        esac
        echo $RELEASE_VERSION
        echo ::set-output name=ver::$RELEASE_VERSION
    - name: Login to DockerHub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        username: icymint
        password: ${{ secrets.DOCKER_PASS }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build and Push
      uses: docker/build-push-action@v7
      with:
        context: ${{ matrix.container }}
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          icymint/${{matrix.container}}:v${{ steps.get_ver.outputs.ver }}
          icymint/${{matrix.container}}:${{ steps.get_ver.outputs.ver }}
          icymint/${{matrix.container}}:latest
