name: Build xn (PGO+BOLT)

# 不按天编译：每小时只检查上游 leptonyu/xn 的 main SHA，只有 SHA 变化（或手动 force /
# repository_dispatch）才跑 60–90 分钟的 PGO+BOLT。构建成功后把 SHA 写进仓库变量
# XN_LAST_MAIN_SHA；下一次看到同一个 SHA 就跳过。
#
# 目前不传 --bolt：release.sh 走 PGO-only。perf / bolt-23 仍照装，后续要启用 BOLT
# 时加参数即可，不用再改环境。
#
# 发布目标是 leptonyu/xn 的 v<Cargo.toml version> release：不存在就新建（tag 指向本次
# 构建的上游 commit），存在就追加资产；需要写权限的 XN_REPO_TOKEN。
#
# 上游想立即触发，可在自己的 workflow 里发：
#   repository_dispatch:
#     event_type: xn-main-updated
#     client_payload: { sha: <commit> }
# 没有 dispatch 时，最多晚一小时发现 main 更新；也可手动 workflow_dispatch。

on:
  schedule:
    - cron: "17 * * * *" # 每小时 :17 检查一次，不编译
  workflow_dispatch:
    inputs:
      force:
        description: 即使 main SHA 未变化也编译
        type: choice
        options:
          - "false"
          - "true"
        default: "false"
      ref:
        description: 指定上游 ref（留空 = main；用于 --tuned 尚未合入 main）
        required: false
        default: ""
      tag:
        description: 目标 release tag（留空 = Cargo.toml 的 v<version>）
        required: false
        default: ""
      event:
        description: BOLT stage2 的 perf event
        required: false
        default: cpu-clock:u
      features:
        description: cargo features（留空 = 默认，不加 quic）
        required: false
        default: ""
  repository_dispatch:
    types: [xn-main-updated]

permissions:
  contents: read  # 只读本仓库；xn release 用 XN_REPO_TOKEN 写
  actions: write  # gh variable set 记录已构建的 main SHA

concurrency:
  group: xn-pgo-bolt
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      ref: ${{ steps.resolve.outputs.ref }}
      changed: ${{ steps.decide.outputs.changed }}
    steps:
      - name: Check XN_REPO_TOKEN
        env:
          GH_TOKEN: ${{ secrets.XN_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::需要仓库 secret XN_REPO_TOKEN（对 leptonyu/xn 至少 contents:write）"
            exit 1
          fi
          can_push="$(gh api repos/leptonyu/xn --jq .permissions.push)"
          if [ "$can_push" != "true" ]; then
            echo "::error::XN_REPO_TOKEN 对 leptonyu/xn 没有写权限；创建/更新 v<version> release 需要 contents:write"
            exit 1
          fi
      - name: Resolve upstream ref
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.XN_REPO_TOKEN }}
          INPUT_REF: ${{ inputs.ref }}
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          ref="${INPUT_REF:-main}"
          sha="${PAYLOAD_SHA:-}"
          if [ -z "$sha" ]; then
            # 用 query 参数解析 ref：分支名里的 / 不需要手工 URL 编码。
            sha="$(gh api --method GET repos/leptonyu/xn/commits \
              -f "sha=$ref" -f per_page=1 --jq ".[0].sha")"
          fi
          [ -n "$sha" ] || { echo "::error::解析不到 $ref 的 SHA"; exit 1; }
          {
            echo "sha=$sha"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"
      - name: Prepare state dir
        run: mkdir -p .xn-built-sha
      - name: Restore built marker
        id: built
        # 变量之外的第二道“已构建”标记；变量写失败时也不会每小时重编。
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: .xn-built-sha
          key: xn-main-sha-${{ steps.resolve.outputs.sha }}
          lookup-only: true
      - name: Decide whether to build
        id: decide
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          REF: ${{ steps.resolve.outputs.ref }}
          LAST_SHA: ${{ vars.XN_LAST_MAIN_SHA }}
          CACHE_HIT: ${{ steps.built.outputs.cache-hit }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          changed=true
          if [ "$REF" = "main" ] && [ "$FORCE" != "true" ]; then
            if [ "$SHA" = "${LAST_SHA:-}" ] || [ "${CACHE_HIT:-false}" = "true" ]; then
              changed=false
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          {
            echo "### upstream"
            echo "- ref: \`$REF\`"
            echo "- sha: \`$SHA\`"
            echo "- last built (variable): \`${LAST_SHA:-<未记录>}\`"
            echo "- cache marker: \`${CACHE_HIT:-false}\`"
            echo "- build: \`$changed\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Checkout upstream xn
        uses: actions/checkout@v7
        with:
          repository: leptonyu/xn
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.XN_REPO_TOKEN }}
          path: .cache/xn-src
          fetch-depth: 1
          persist-credentials: false
      - name: Install system dependencies
        # 与上游 tag release 同一套：LLVM 23 + bolt-23 + perf。BOLT 暂时不启用，
        # perf 装而不用；启用 --bolt 时用 software event cpu-clock:u（托管 runner 没有 PMU/LBR）。
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake perl nasm \
            clang lld \
            libclang-dev libssl-dev zlib1g-dev liblzma-dev \
            curl git xz-utils file binutils python3 openssl lsb-release
          # perf 不走 linux-tools-generic：它按 uname -r 依赖
          # linux-tools-<ver>-<flavor>，Ubuntu archive 的 metapackage 偶尔领先于
          # 具体包（pocket 同步滞后），apt 会整体报 "held broken packages"
          # （Launchpad #2140491）。脚本按版本挑一个确实存在的包并链到
          # /usr/local/bin/perf。
          ./xn/install-perf.sh
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 23
          sudo apt-get install -y llvm-23 llvm-23-tools bolt-23 lld-23 clang-23
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"
          echo 'kernel.perf_event_paranoid=1' | sudo tee /etc/sysctl.d/99-xn-perf.conf >/dev/null
          sudo sysctl --system
          # BOLT 没启用，这里只确认 perf 装上了；真要开 --bolt 时再加一次
          # `perf record -e <event> -- sleep 0.1` 的真采样自检
          # （托管 runner 的 perf_event_open 有被平台拒绝的先例，runner-images#4974）。
          perf --version
          /usr/lib/llvm-23/bin/llvm-bolt --version
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install sccache
        # 上游 docs/dev-environment.md 的装法：`brew install sccache` / `cargo install sccache`，
        # 目的是让 scripts/cargo-env.sh 在 PATH → $CARGO_HOME/bin → ~/.cargo/bin 里找到它。
        # CI 用预编译二进制（同样落在 $CARGO_HOME/bin），省掉现场编译 sccache 的几分钟。
        uses: taiki-e/install-action@sccache
      - name: Verify sccache
        # 直接 source 上游的 scripts/cargo-env.sh —— 它就是 release.sh 每次跑时用的探测
        # 逻辑。确认它真把 RUSTC_WRAPPER 设成 sccache（否则会打「这次构建不套 sccache」），
        # 再真编一个空程序走一遍 wrapper，别等 60 分钟构建后才发现缓存没生效。
        run: |
          set -euo pipefail
          env_sh="$GITHUB_WORKSPACE/.cache/xn-src/scripts/cargo-env.sh"
          [[ -f "$env_sh" ]] || { echo "上游 checkout 里没有 scripts/cargo-env.sh"; exit 1; }
          source "$env_sh"
          echo "RUSTC_WRAPPER=${RUSTC_WRAPPER:-<unset>}"
          test "${RUSTC_WRAPPER:-}" = sccache
          sccache --version
          tmp="$(mktemp -d)"
          printf 'fn main() {}\n' > "$tmp/t.rs"
          RUSTC_WRAPPER=sccache rustc "$tmp/t.rs" -o "$tmp/t"
          "$tmp/t"
          sccache --show-stats | sed -n '1,6p'
          sccache --stop-server || true
      - name: Install cargo-nextest
        # release.sh --tuned 默认用 pgo.sh tests 跑 release 档 nextest 采样。
        uses: taiki-e/install-action@nextest
      - name: Install cargo-deny
        # 只为打包时生成 THIRD-PARTY-NOTICES.txt。
        uses: taiki-e/install-action@cargo-deny
      - name: Build tuned xn and publish
        env:
          GH_TOKEN: ${{ secrets.XN_REPO_TOKEN }}
          LLVM_PROFDATA: /usr/lib/llvm-23/bin/llvm-profdata
          INPUT_FEATURES: ${{ inputs.features }}
          INPUT_TAG: ${{ inputs.tag }}
          # 缓存目录由 cargo-env.sh 指到 target/sccache（跟检出走）；fresh runner 上
          # 命中本来就少，压到 1G，免得和 PGO 的 target 抢那 14G 盘。
          SCCACHE_CACHE_SIZE: 1G
        run: |
          set -euo pipefail
          args=(
            --src "$GITHUB_WORKSPACE/.cache/xn-src"
            --publish
            --event "${{ inputs.event || 'cpu-clock:u' }}"
          )
          if [ -n "${INPUT_TAG:-}" ]; then args+=(--tag "$INPUT_TAG"); fi
          if [ -n "${INPUT_FEATURES:-}" ]; then args+=(--features "$INPUT_FEATURES"); fi
          ./xn/build.sh "${args[@]}"
      - name: Prepare built marker
        if: success() && needs.check.outputs.ref == 'main'
        run: |
          mkdir -p .xn-built-sha
          printf '%s\n' "${{ needs.check.outputs.sha }}" > .xn-built-sha/sha
      - name: Save built marker
        # 与仓库变量并存：变量写不了时，下一轮靠这个 cache 跳过重编。
        if: success() && needs.check.outputs.ref == 'main'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .xn-built-sha
          key: xn-main-sha-${{ needs.check.outputs.sha }}
      - name: Record built main SHA
        # 只有 main 的构建才更新状态；手动指定 ref 时不污染 main 的已构建 SHA。
        if: success() && needs.check.outputs.ref == 'main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh variable set XN_LAST_MAIN_SHA \
            --repo "$GITHUB_REPOSITORY" \
            --body "${{ needs.check.outputs.sha }}"
      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xn-pgo-bolt
          # 调优两个包 + extras（cidr / xn-tui）+ 各自的 .sha256sum；build.log 在过程包里。
          path: |
            xn/dist/*.tar.xz
            xn/dist/*.sha256sum
          if-no-files-found: ignore
