  # ---------------------------------------------------------------- compare
  linux-compare:
    name: pgo.compare x86_64（不重编）
    # 普通 bin 和 tuned bin 分属两个 job，这里把两边的 bin 凑到一起再做同机 A/B；
    # 中转走私有仓库的 `xn-ci` release（public artifact 不放私有产物）。
    #   compare=true：两档 build 都成功、或标记命中已构建（skipped）后跑；skipped 的档用
    #                 xn-ci 里上次传的 bin（同一 SHA；bin 不全会下载失败，用 force=true 重编）；
    #   compare=only：不构建，用 xn-ci 里现成的 bin —— check 已确认这一档 bin 齐。
    needs: [check, linux-x86_64, linux-x86_64-tuned]
    if: |
      always() &&
      needs.check.result == 'success' &&
      (needs.check.outputs.target == 'all' || needs.check.outputs.target == 'x86_64-linux-gnu') &&
      (
        (inputs.compare == 'only' && needs.check.outputs.bins_x86_64 == 'true') ||
        (inputs.compare == 'true' &&
         (needs.linux-x86_64.result == 'success' || needs.linux-x86_64.result == 'skipped') &&
         (needs.linux-x86_64-tuned.result == 'success' || needs.linux-x86_64-tuned.result == 'skipped') &&
         (needs.linux-x86_64.result == 'success' || needs.linux-x86_64-tuned.result == 'success'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Checkout upstream xn
        uses: actions/checkout@v7
        with:
          repository: leptonyu/xn
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.XN_REPO_TOKEN }}
          path: .cache/xn-src
          fetch-depth: 1
          persist-credentials: false
      - name: 从私有 release 取两档的 bin
        env:
          GH_TOKEN: ${{ secrets.XN_REPO_TOKEN }}
          COMPARE: ${{ inputs.compare }}
        run: |
          set -euo pipefail
          if [ "$COMPARE" = "only" ]; then
            echo "::notice::compare=only：用 xn-ci 里现成的 bin（可能是更早一轮的构建，不重编）"
          fi
          mkdir -p xn/dist
          gh release download xn-ci --repo leptonyu/xn \
            --pattern 'xn.x86_64-unknown-linux-gnu.*.bin' --dir xn/dist --clobber || true
          for f in xn.x86_64-unknown-linux-gnu.release.bin xn.x86_64-unknown-linux-gnu.tuned.bin; do
            if [ ! -f "xn/dist/$f" ]; then
              echo "::error::xn-ci 里缺 $f：compare=true 时某一档若是 skipped，说明它上次的 bin 不在中转 release；用 force=true 重编这一档，或先跑一轮构建"
              exit 1
            fi
          done
          ls -l xn/dist
      - name: Run pgo.compare（普通 bin vs PGO bin，不重编）
        run: |
          set -euo pipefail
          ./xn/compare.sh \
            --src "$GITHUB_WORKSPACE/.cache/xn-src" \
            --target x86_64-unknown-linux-gnu \
            --rounds 4
      - name: 对比报告归档到私有 release
        # 报告里有私有代码的符号/函数名，不能进 public artifact。
        if: always()
        env:
          GH_TOKEN: ${{ secrets.XN_REPO_TOKEN }}
        run: |
          set -euo pipefail
          args=()
          for d in target/test-runs target/pgo; do
            if [[ -d ".cache/xn-src/$d" ]]; then args+=("$d"); fi
          done
          (( ${#args[@]} )) || { echo "没有 compare 产物，跳过"; exit 0; }
          tar -czf "compare-x86_64-linux-gnu.tar.gz" -C .cache/xn-src "${args[@]}"
          for i in 1 2 3 4; do
            gh release upload xn-ci "compare-x86_64-linux-gnu.tar.gz" --repo leptonyu/xn --clobber && exit 0
            sleep $((i * 2))
          done
          echo "::error::上传对比报告失败"
          exit 1

  macos-compare:
    name: pgo.compare aarch64-macos（只比尺寸，不重编）
    # macOS 产物是 Mach-O，Linux perf rig 跑不了：只比两个 bin 的大小，同样不重编。
    #   compare=true：两档 build 都成功、或标记命中已构建（skipped）后跑；skipped 的档用
    #                 xn-ci 里上次传的 bin（同一 SHA；bin 不全会下载失败，用 force=true 重编）；
    #   compare=only：用 xn-ci 里现成的 bin。
    needs: [check, macos-aarch64, macos-aarch64-tuned]
    if: |
      always() &&
      needs.check.result == 'success' &&
      (needs.check.outputs.target == 'all' || needs.check.outputs.target == 'aarch64-macos') &&
      (
        (inputs.compare == 'only' && needs.check.outputs.bins_macos == 'true') ||
        (inputs.compare == 'true' &&
         (needs.macos-aarch64.result == 'success' || needs.macos-aarch64.result == 'skipped') &&
         (needs.macos-aarch64-tuned.result == 'success' || needs.macos-aarch64-tuned.result == 'skipped') &&
         (needs.macos-aarch64.result == 'success' || needs.macos-aarch64-tuned.result == 'success'))
      )
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Checkout upstream xn
        uses: actions/checkout@v7
        with:
          repository: leptonyu/xn
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.XN_REPO_TOKEN }}
          path: .cache/xn-src
          fetch-depth: 1
          persist-credentials: false
      - name: 从私有 release 取两档的 bin
        env:
          GH_TOKEN: ${{ secrets.XN_REPO_TOKEN }}
          COMPARE: ${{ inputs.compare }}
        run: |
          set -euo pipefail
          if [ "$COMPARE" = "only" ]; then
            echo "::notice::compare=only：用 xn-ci 里现成的 bin（可能是更早一轮的构建，不重编）"
          fi
          mkdir -p xn/dist
          gh release download xn-ci --repo leptonyu/xn \
            --pattern 'xn.aarch64-apple-darwin.*.bin' --dir xn/dist --clobber || true
          for f in xn.aarch64-apple-darwin.release.bin xn.aarch64-apple-darwin.tuned.bin; do
            if [ ! -f "xn/dist/$f" ]; then
              echo "::error::xn-ci 里缺 $f：compare=true 时某一档若是 skipped，说明它上次的 bin 不在中转 release；用 force=true 重编这一档，或先跑一轮构建"
              exit 1
            fi
          done
          ls -l xn/dist
      - name: Run pgo.compare (size-only on macOS)
        run: |
          set -euo pipefail
          ./xn/compare.sh \
            --src "$GITHUB_WORKSPACE/.cache/xn-src" \
            --target aarch64-apple-darwin \
            --size-only \
            --rounds 4
      - name: 对比报告归档到私有 release
        # 报告里有私有代码的符号/函数名，不能进 public artifact。
        if: always()
        env:
          GH_TOKEN: ${{ secrets.XN_REPO_TOKEN }}
        run: |
          set -euo pipefail
          args=()
          for d in target/test-runs target/pgo; do
            if [[ -d ".cache/xn-src/$d" ]]; then args+=("$d"); fi
          done
          (( ${#args[@]} )) || { echo "没有 compare 产物，跳过"; exit 0; }
          tar -czf "compare-aarch64-macos.tar.gz" -C .cache/xn-src "${args[@]}"
          for i in 1 2 3 4; do
            gh release upload xn-ci "compare-aarch64-macos.tar.gz" --repo leptonyu/xn --clobber && exit 0
            sleep $((i * 2))
          done
          echo "::error::上传对比报告失败"
          exit 1

  # ---------------------------------------------------------------- record
  # 记账只看**普通档**（x86_64 / armv7 / macOS 三个 job）：tuned 是独立 job，挂了不影响
  # 普通包发布，也不阻塞 XN_LAST_MAIN_SHA。已构建标记按 job 独立，失败/没跑的 job 下一轮
  # check 会接着补（不必等上游下一次提交）；想一次全重编就手动 dispatch（force=true）。
  record:
    name: record built main SHA
    needs: [check, linux-x86_64, linux-armv7, macos-aarch64]
    if: |
      always() &&
      needs.check.result == 'success' &&
      inputs.compare != 'only' &&
      needs.check.outputs.changed == 'true' &&
      needs.check.outputs.ref == 'main' &&
      needs.check.outputs.target == 'all' &&
      (needs.linux-x86_64.result == 'success' || needs.linux-x86_64.result == 'skipped') &&
      (needs.linux-armv7.result == 'success' || needs.linux-armv7.result == 'skipped') &&
      (needs.macos-aarch64.result == 'success' || needs.macos-aarch64.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Record built main SHA
        continue-on-error: true
        env:
          # GITHUB_TOKEN 写不了 Actions Variables（即使 actions: write 也是 403），所以：
          #   1) 优先 XN_VARS_TOKEN（fine-grained PAT，Variables: read/write，最小权限）；
          #   2) 没配就复用 XN_REPO_TOKEN —— 它是 classic PAT（repo scope）时能写本仓库变量；
          #      只授了 leptonyu/xn 的 fine-grained token 会 403，只打 warning。
          # 跳过构建始终看每个 build job 自己的 cache 标记（xn-built-<sha256>-<job>）；
          # 这个变量只是「最近一次三个普通档齐全的 main SHA」记录，不参与判定。
          XN_VARS_TOKEN: ${{ secrets.XN_VARS_TOKEN }}
          XN_REPO_TOKEN: ${{ secrets.XN_REPO_TOKEN }}
          SHA: ${{ needs.check.outputs.sha }}
          SHA_DIGEST: ${{ needs.check.outputs.cache_key }}
        run: |
          set -uo pipefail
          got=""
          used=""
          for name in XN_VARS_TOKEN XN_REPO_TOKEN; do
            tok="$(printenv "$name" 2>/dev/null || true)"
            [[ -n "$tok" ]] || continue
            if GH_TOKEN="$tok" gh variable set XN_LAST_MAIN_SHA \
              --repo "$GITHUB_REPOSITORY" --body "$SHA" >/dev/null 2>&1; then
              got="$(GH_TOKEN="$tok" gh api \
                "repos/${GITHUB_REPOSITORY}/actions/variables/XN_LAST_MAIN_SHA" \
                --jq .value 2>/dev/null || true)"
              used="$name"
              [[ "$got" == "$SHA" ]] && break
            fi
          done
          var_state="未更新"
          [[ -n "$got" ]] && var_state="已更新"
          {
            echo "### record built main SHA"
            # 本仓库 public：summary 写摘要前缀，不写上游 SHA。
            echo "- sha: \`sha256:${SHA_DIGEST:0:12}…\`"
            echo "- 已构建标记: 每个 build job 各自一份 \`xn-built-<sha256>-<job>\`（下一轮 check 只跳完成的）"
            echo "- XN_LAST_MAIN_SHA: \`${var_state}\`（${used:-没有可写变量的 token}）"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$got" != "$SHA" ]]; then
            echo "::warning::XN_LAST_MAIN_SHA 没更新：XN_VARS_TOKEN 没配、XN_REPO_TOKEN 也写不了（多半是只授了 leptonyu/xn 的 fine-grained token）。已构建标记仍以各 build job 的 cache 标记 \`xn-built-<sha256>-<job>\` 为准，不影响下一轮跳过；要更新变量就配 XN_VARS_TOKEN（fine-grained，Variables: read/write），或把 XN_REPO_TOKEN 换成 classic PAT（repo scope）。"
          fi
