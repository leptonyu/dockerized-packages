name: 发布 XN
run-name: "发布 XN · ${{ inputs.target || 'all' }}"

# 交付目标（`target` 下拉，默认 all，可单编一个）：
#   all                      三个都编（x86_64 Linux + armv7 Linux + aarch64 macOS）
#   x86_64-linux-gnu         ubuntu-latest，原生 PGO（BOLT 默认不开）
#   armv7-linux-musleabihf   ubuntu-latest，交叉；**普通 release 编译（无 PGO/BOLT）**
#                            ——armv7 二进制任何 runner 都跑不了，采不了样；只出 runtime 包
#   aarch64-macos            macos-15（Apple silicon），原生 PGO（BOLT 不可用）
#
# **每个目标一个 job，`check` 之后同时开跑**：x86_64 / armv7 / macOS 互不等待，各自构建、
# 各自上传 artifact；重跑某一档不会带着另外两档一起重跑，也不会先跑别的档来给它铺路。
#
# `compare` 下拉（默认 false）：构建完成后在本 runner 跑 `pgo.compare`（bin 大小 + t1 同机
# A/B；macOS 自动退 `pgo.compare.size`）。armv7 交叉档没有同机 control / 采样，不跑。
#
# 触发：每小时检查上游 main SHA（未变就跳过）；手动 force；repository_dispatch
# `xn-main-updated`。构建成功把 SHA 记到 XN_LAST_MAIN_SHA；发布到上游 v<Cargo.toml version>
# release（需要写权限的 XN_REPO_TOKEN）。

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "true=即使 main SHA 未变化也编译；false=只在 main 有新提交时编译"
        type: choice
        options:
          - "false"
          - "true"
        default: "false"
      target:
        description: >-
          all=三个目标并发都编 | x86_64-linux-gnu=Ubuntu x86_64 原生 PGO |
          armv7-linux-musleabihf=Ubuntu 交叉 armv7（普通 release，无 PGO，只出 runtime 包） |
          aarch64-macos=macOS arm64 原生 PGO（BOLT 不可用）
        type: choice
        required: true
        default: all
        options:
          - all
          - x86_64-linux-gnu
          - armv7-linux-musleabihf
          - aarch64-macos
      compare:
        description: >-
          true=构建后跑 pgo.compare（x86_64 完整 A/B；macOS 自动退 bin 尺寸；armv7 交叉档不跑）
        type: choice
        required: true
        default: "false"
        options:
          - "false"
          - "true"
      ref:
        description: 指定上游 ref（留空 = main）
        required: false
        default: ""
      tag:
        description: 目标 release tag（留空 = Cargo.toml 的 v<version>）
        required: false
        default: ""
      features:
        description: cargo features（留空 = 默认）
        required: false
        default: ""
  repository_dispatch:
    types: [xn-main-updated]

permissions:
  contents: read
  actions: write

concurrency:
  group: xn-pgo-bolt
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      ref: ${{ steps.resolve.outputs.ref }}
      changed: ${{ steps.decide.outputs.changed }}
      target: ${{ steps.target.outputs.target }}
    steps:
      - name: Check XN_REPO_TOKEN
        env:
          GH_TOKEN: ${{ secrets.XN_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::需要仓库 secret XN_REPO_TOKEN（对 leptonyu/xn 至少 contents:write）"
            exit 1
          fi
          can_push="$(gh api repos/leptonyu/xn --jq .permissions.push)"
          if [ "$can_push" != "true" ]; then
            echo "::error::XN_REPO_TOKEN 对 leptonyu/xn 没有写权限；创建/更新 v<version> release 需要 contents:write"
            exit 1
          fi
      - name: Resolve target
        id: target
        env:
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          # schedule / repository_dispatch 没有 inputs：按 all 处理。
          echo "target=${INPUT_TARGET:-all}" >> "$GITHUB_OUTPUT"
      - name: Resolve upstream ref
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.XN_REPO_TOKEN }}
          INPUT_REF: ${{ inputs.ref }}
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          ref="${INPUT_REF:-main}"
          sha="${PAYLOAD_SHA:-}"
          if [ -z "$sha" ]; then
            sha="$(gh api --method GET repos/leptonyu/xn/commits \
              -f "sha=$ref" -f per_page=1 --jq ".[0].sha")"
          fi
          [ -n "$sha" ] || { echo "::error::解析不到 $ref 的 SHA"; exit 1; }
          {
            echo "sha=$sha"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"
      - name: Prepare state dir
        run: mkdir -p .xn-built-sha
      - name: Restore built marker
        id: built
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: .xn-built-sha
          key: xn-main-sha-${{ steps.resolve.outputs.sha }}
          lookup-only: true
      - name: Decide whether to build
        id: decide
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          REF: ${{ steps.resolve.outputs.ref }}
          LAST_SHA: ${{ vars.XN_LAST_MAIN_SHA }}
          CACHE_HIT: ${{ steps.built.outputs.cache-hit }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          changed=true
          if [ "$REF" = "main" ] && [ "$FORCE" != "true" ]; then
            if [ "$SHA" = "${LAST_SHA:-}" ] || [ "${CACHE_HIT:-false}" = "true" ]; then
              changed=false
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          {
            echo "### upstream"
            echo "- ref: \`$REF\`"
            echo "- sha: \`$SHA\`"
            echo "- target: \`${{ steps.target.outputs.target }}\`"
            echo "- build: \`$changed\`"
          } >> "$GITHUB_STEP_SUMMARY"

  linux-x86_64:
    name: build x86_64-linux-gnu
    needs: check
    if: |
      needs.check.outputs.changed == 'true' && (
        needs.check.outputs.target == 'all' ||
        needs.check.outputs.target == 'x86_64-linux-gnu')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - name: Checkout upstream xn
        uses: actions/checkout@v7
        with:
          repository: leptonyu/xn
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.XN_REPO_TOKEN }}
          path: .cache/xn-src
          fetch-depth: 1
          persist-credentials: false
      - name: Install system dependencies
        # BOLT 默认不开（PGO-only），但 perf / LLVM 23 / bolt-23 保持装好，打开 --bolt 不用再改环境。
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake perl nasm \
            clang lld \
            libclang-dev libssl-dev zlib1g-dev liblzma-dev \
            curl git xz-utils file binutils python3 openssl lsb-release
          ./xn/install-perf.sh
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 23
          sudo apt-get install -y llvm-23 llvm-23-tools bolt-23 lld-23 clang-23
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"
          echo 'kernel.perf_event_paranoid=1' | sudo tee /etc/sysctl.d/99-xn-perf.conf >/dev/null
          sudo sysctl --system
          perf --version
          /usr/lib/llvm-23/bin/llvm-bolt --version
      - name: Install Rust
        # 按仓库的 rust-toolchain.toml 装精确版本，避免 runner 预装的 rustc 和上游
        # 期望的不一致。
        run: |
          toolchain="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' "$GITHUB_WORKSPACE/.cache/xn-src/rust-toolchain.toml")"
          rustup set profile minimal
          rustup toolchain install "$toolchain"
          rustup default "$toolchain"
          rustup component add --toolchain "$toolchain" llvm-tools-preview
      - name: Install sccache
        uses: taiki-e/install-action@sccache
      - name: Verify sccache
        run: |
          set -euo pipefail
          env_sh="$GITHUB_WORKSPACE/.cache/xn-src/scripts/cargo-env.sh"
          [[ -f "$env_sh" ]] || { echo "上游 checkout 里没有 scripts/cargo-env.sh"; exit 1; }
          source "$env_sh"
          echo "RUSTC_WRAPPER=${RUSTC_WRAPPER:-<unset>}"
          test "${RUSTC_WRAPPER:-}" = sccache
          sccache --version
          tmp="$(mktemp -d)"
          printf 'fn main() {}\n' > "$tmp/t.rs"
          RUSTC_WRAPPER=sccache rustc "$tmp/t.rs" -o "$tmp/t"
          "$tmp/t"
          sccache --show-stats | sed -n '1,6p'
          sccache --stop-server || true
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: Build tuned xn
        env:
          GH_TOKEN: ${{ secrets.XN_REPO_TOKEN }}
          LLVM_PROFDATA: /usr/lib/llvm-23/bin/llvm-profdata
          INPUT_FEATURES: ${{ inputs.features }}
          INPUT_TAG: ${{ inputs.tag }}
          SCCACHE_CACHE_SIZE: 1G
        run: |
          set -euo pipefail
          args=(
            --src "$GITHUB_WORKSPACE/.cache/xn-src"
            --publish
          )
          [ -n "${INPUT_TAG:-}" ] && args+=(--tag "$INPUT_TAG")
          [ -n "${INPUT_FEATURES:-}" ] && args+=(--features "$INPUT_FEATURES")
          ./xn/build.sh --target x86_64-unknown-linux-gnu "${args[@]}"
      - name: Run pgo.compare
        if: ${{ inputs.compare == 'true' }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/.cache/xn-src"
          scripts/test/pgo/compare-ci.sh --rounds 4
      - name: Upload pgo compare artifacts
        if: always() && inputs.compare == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: xn-pgo-compare-x86_64-linux-gnu
          path: |
            .cache/xn-src/target/test-runs
            .cache/xn-src/target/pgo
          if-no-files-found: warn
          retention-days: 14
      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xn-pgo-bolt-x86_64-linux-gnu
          path: |
            xn/dist/*.tar.xz
            xn/dist/*.sha256sum
          if-no-files-found: ignore

  linux-armv7:
    name: build armv7-linux-musleabihf
    # 跟 x86_64 / macOS 一样只看 check：三档同时开跑，armv7 不排在 x86_64 后面等任何东西。
    # armv7 走普通 release 交叉编译（无 PGO/BOLT），不需要 profile。
    needs: check
    if: |
      needs.check.outputs.changed == 'true' && (
        needs.check.outputs.target == 'all' ||
        needs.check.outputs.target == 'armv7-linux-musleabihf')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      # 只编一次交叉档；sccache 的下载/启动（macOS 的 SUN_LEN、GitHub release 504）
      # 不值得再引入一个失败点。
      XN_SCCACHE: "off"
    steps:
      - uses: actions/checkout@v7
      - name: Checkout upstream xn
        uses: actions/checkout@v7
        with:
          repository: leptonyu/xn
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.XN_REPO_TOKEN }}
          path: .cache/xn-src
          fetch-depth: 1
          persist-credentials: false
      - name: Install system dependencies
        # 交叉档的 C 依赖由 cargo-zigbuild 用 zig cc 编；这里只装 bindgen（libclang）与
        # release.sh --pack 需要的工具，不装 perf / LLVM 23 / BOLT。
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake perl nasm \
            clang lld libclang-dev libssl-dev zlib1g-dev liblzma-dev \
            curl git xz-utils file binutils python3 openssl
      - name: Install Rust
        run: |
          toolchain="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' "$GITHUB_WORKSPACE/.cache/xn-src/rust-toolchain.toml")"
          rustup set profile minimal
          rustup toolchain install "$toolchain"
          rustup default "$toolchain"
          rustup target add --toolchain "$toolchain" armv7-unknown-linux-musleabihf
      - name: Install cargo-deny
        # release.sh --pack 会调 gen-notices.sh（需要 cargo-deny）。
        uses: taiki-e/install-action@cargo-deny
      - name: Build armv7 (plain release) and publish
        env:
          GH_TOKEN: ${{ secrets.XN_REPO_TOKEN }}
          INPUT_FEATURES: ${{ inputs.features }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          args=(
            --src "$GITHUB_WORKSPACE/.cache/xn-src"
            --target armv7-unknown-linux-musleabihf
            --no-extras
            --publish
          )
          [ -n "${INPUT_TAG:-}" ] && args+=(--tag "$INPUT_TAG")
          [ -n "${INPUT_FEATURES:-}" ] && args+=(--features "$INPUT_FEATURES")
          ./xn/build.sh "${args[@]}"
      - name: pgo.compare not applicable
        if: ${{ inputs.compare == 'true' }}
        run: |
          echo "::notice::armv7-linux-musleabihf 是交叉目标，没有同机 control / profile 采样；pgo.compare 只在 x86_64 / macOS 原生任务上跑"
      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xn-armv7-linux-musleabihf
          path: |
            xn/dist/*.tar.xz
            xn/dist/*.sha256sum
          if-no-files-found: ignore

  macos-aarch64:
    name: build aarch64-macos
    needs: check
    if: |
      needs.check.outputs.changed == 'true' && (
        needs.check.outputs.target == 'all' ||
        needs.check.outputs.target == 'aarch64-macos')
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Checkout upstream xn
        uses: actions/checkout@v7
        with:
          repository: leptonyu/xn
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.XN_REPO_TOKEN }}
          path: .cache/xn-src
          fetch-depth: 1
          persist-credentials: false
      - name: Install Rust
        run: |
          toolchain="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' "$GITHUB_WORKSPACE/.cache/xn-src/rust-toolchain.toml")"
          rustup set profile minimal
          rustup toolchain install "$toolchain"
          rustup default "$toolchain"
          rustup component add --toolchain "$toolchain" llvm-tools-preview
      - name: Install sccache
        uses: taiki-e/install-action@sccache
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: Build tuned xn and publish
        env:
          GH_TOKEN: ${{ secrets.XN_REPO_TOKEN }}
          INPUT_FEATURES: ${{ inputs.features }}
          INPUT_TAG: ${{ inputs.tag }}
          SCCACHE_CACHE_SIZE: 1G
        run: |
          set -euo pipefail
          args=(
            --src "$GITHUB_WORKSPACE/.cache/xn-src"
            --target aarch64-apple-darwin
            --publish
          )
          [ -n "${INPUT_TAG:-}" ] && args+=(--tag "$INPUT_TAG")
          [ -n "${INPUT_FEATURES:-}" ] && args+=(--features "$INPUT_FEATURES")
          ./xn/build.sh "${args[@]}"
      - name: Run pgo.compare (size-only on macOS)
        if: ${{ inputs.compare == 'true' }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/.cache/xn-src"
          scripts/test/pgo/compare-ci.sh --rounds 4
      - name: Upload pgo compare artifacts
        if: always() && inputs.compare == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: xn-pgo-compare-aarch64-macos
          path: |
            .cache/xn-src/target/test-runs
            .cache/xn-src/target/pgo
          if-no-files-found: warn
          retention-days: 14
      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xn-pgo-bolt-aarch64-macos
          path: |
            xn/dist/*.tar.xz
            xn/dist/*.sha256sum
          if-no-files-found: ignore

  # 所有选中目标都成功后才记 main SHA：拆成三个 job 后，早完成的 x86_64 不能代表
  # armv7 / macOS 也过了。
  record:
    name: record built main SHA
    needs: [check, linux-x86_64, linux-armv7, macos-aarch64]
    if: |
      always() &&
      needs.check.outputs.changed == 'true' &&
      needs.check.outputs.ref == 'main' &&
      needs.check.outputs.target == 'all' &&
      needs.linux-x86_64.result == 'success' &&
      needs.linux-armv7.result == 'success' &&
      needs.macos-aarch64.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Prepare built marker
        run: |
          mkdir -p .xn-built-sha
          printf '%s\n' "${{ needs.check.outputs.sha }}" > .xn-built-sha/sha
      - name: Save built marker
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .xn-built-sha
          key: xn-main-sha-${{ needs.check.outputs.sha }}
      - name: Record built main SHA
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          set -uo pipefail
          # 记不进去 = 下一轮还会重建同一个 SHA。别静悄悄地失败：重试后读回来确认一次。
          for i in 1 2 3; do
            if gh variable set XN_LAST_MAIN_SHA --repo "$GITHUB_REPOSITORY" --body "$SHA"; then
              break
            fi
            echo "::warning::gh variable set 第 ${i}/3 次失败，5s 后重试"
            sleep 5
          done
          got="$(gh api "repos/${GITHUB_REPOSITORY}/actions/variables/XN_LAST_MAIN_SHA" --jq .value 2>/dev/null || true)"
          {
            echo "### record built main SHA"
            echo "- sha: \`${SHA}\`"
            echo "- XN_LAST_MAIN_SHA: \`${got:-<读取失败>}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$got" != "$SHA" ]]; then
            echo "::error::XN_LAST_MAIN_SHA 没记成（当前 ${got:-<空>}）；cache 标记仍在，但仓库变量没更新"
            exit 1
          fi
