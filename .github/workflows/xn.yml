name: 发布 XN
run-name: "发布 XN · ${{ inputs.target || 'all' }} · compare=${{ inputs.compare || 'false' }}"

# 交付目标（`target` 下拉，默认 all，可单编一个）：
#   all                      三个都编（x86_64 Linux + armv7 Linux + aarch64 macOS）
#   x86_64-linux-gnu         ubuntu-latest：普通包 + tuned（原生 PGO；BOLT 默认不开）
#   armv7-linux-musleabihf   ubuntu-latest，交叉；**只有普通 release 编译（无 PGO/BOLT）**
#                            ——armv7 二进制任何 runner 都跑不了，采不了样
#   aarch64-macos            macos-15（Apple silicon）：普通包 + tuned（PGO；BOLT 不可用）
#
# **每个目标一个 job，`check` 之后同时开跑**：x86_64 / armv7 / macOS 互不等待，各自构建、
# 各自发布；重跑某一档不会带着另外两档一起重跑，也不会先跑别的档来给它铺路。
# **不再有 public artifact**：构建产物只进私有上游的 release，见下面的「禁止缓存上游任何东西」。
#
# **档位合并发布**：同一个 `v<version>` release 里，普通包和 tuned 包各自成资产 —
#   xn.<triple>.tar.xz          普通 release 编译（全部目标）
#   xn.<triple>.tuned.tar.xz    PGO/BOLT（x86_64 / macOS）
#   xn.<triple>.tuned.trace.tar.xz
#
# **普通档和 tuned 档各是一个 job，并发跑**（x86_64-release / x86_64-tuned /
# armv7 / macos-release / macos-tuned）：普通包先出，tuned 挂了不影响普通包；两档都往
# 同一个 release 追加资产，资产名互不重叠。
#
# `compare` 下拉（默认 false）：
#   true  两档 build 都成功、或标记命中已构建（skipped）后，`pgo.compare` 把两边的 bin
#         取下来做同机 A/B（`xn/compare.sh` 摆成 build-tuned 的 run 目录，交给上游
#         `compare-ci.sh --no-build`），不重编；skipped 的档用 xn-ci 里上次的 bin
#         （同一 SHA；bin 不全就报错，`force=true` 重编）。macOS 的产物是 Mach-O，退
#         `pgo.compare.size` 只比大小；armv7 交叉档没有同机 control / 采样，不跑。
#   only  本轮完全不构建，直接从已发布的 `v<version>` release 里取普通 / tuned 两档
#         runtime 包，用 `xn/fetch-bin.sh` 解出 xn 再跑 compare（target=all 时只跑包
#         齐的那档；点名单个平台却缺包会直接报错）。给已经构建过（`xn-ci` 里没 bin）
#         的 SHA 补对比、或重跑 A/B 时用这个；发布包在，就不依赖本轮构建。
# compare=true 的 bin 和对比报告仍经私有上游仓库的固定 prerelease `xn-ci` 中转
# （单 tag，`--clobber` 覆盖，不累积）；compare=only 的 bin 直接来自发布包。
#
# **记账只看普通档**：x86_64 / armv7 / macOS 三个普通 job 都是 success 或 skipped
# （skipped = 之前已编过）才写 `XN_LAST_MAIN_SHA`（tuned 不参与，失败了也不会把整轮判死）。
#
# **禁止缓存上游任何东西**：本仓库是 public，`leptonyu/xn` 是 private。
# actions/cache 的 key 和内容对 public 仓库可见/可下载，所以：
#   - 不缓存上游 checkout（`.cache/xn-src` 每轮 actions/checkout 现拉）；
#   - sccache 只在单轮 job 内用（PGO 三阶段复用依赖编译），**不跨 run 缓存**：
#     编译产物（rlib/rmeta）里带着私有代码的 metadata，不能进公开 cache；
#   - 「已构建」标记按 build job 各存一份（`xn-built-<64位hex>-<job>`），标记文件只写
#     固定字符串 —— key/内容里都不出现上游 SHA 或源码。check 据此识别哪些子任务已经
#     完成并跳过，只编缺的那些（非 main ref / force=true 时忽略标记，一律重编）。
# **artifact 同理**：public 仓库的 artifact 对所有人可下载，所以构建产物（tar.xz / .bin）
# 一律不进 artifact，只发私有上游 release；compare=true 的 bin / 报告走 `xn-ci` prerelease，
# compare=only 则从已发布的 runtime 包解出 bin，同样不落 public 存储。
# 新增 cache / artifact 时先问：这东西是不是从 leptonyu/xn 来的？
#
# **镜像**：普通档编完后，`docker` job 用上游自带的运行镜像 `Dockerfile` /
# `Dockerfile.armv7`（只 COPY 产物、不编译）把 xn 做成 amd64 + arm/v7 两档镜像，按 digest
# 推到 ghcr.io/leptonyu/xn，再合并成一个 manifest（`v<version>`，两档齐了再加 `latest`）。
# 上游 Dockerfile 要的产物由这一档自己摆好：两个平台都从**发布包**取二进制 + 随附声明
# （armv7 用的是 `musleabihf` 的 musl 静态二进制，只为满足 `Dockerfile.armv7` 里写死的
# `target/armv7-unknown-linux-gnueabihf/release/xn` 这个 COPY 路径；代价见 job 注释），
# `dlc.dat.xz` 优先按上游
# `fixtures.lock.toml` 钉的 dockerized-packages 制品取并校验 sha256（那个 tag 会被每日
# 清理删掉，取不到就退回最新 release）。
# 镜像同样属于私有产物：
#   - ghcr 包必须保持 **private**（job 末尾查一次可见性，public 会 warning）；
#   - 不配 buildx 缓存（`type=gha` 里就是私有源码编出来的层）；
#   - 不开 provenance / sbom（attestation 会写上 VCS 来源 = 上游仓库和提交 SHA）；
#   - 只按 digest 推、不落 per-arch tag，也不写 `org.opencontainers.image.revision`。
# 镜像只在「本轮真的编了普通档」时推：跟着 release 走，不是每小时重建；两档都 skipped
# 不推，要重推就 `force=true`。普通档任一失败就整档不推，免得发布半个 manifest。
#
# 触发：每小时检查上游 main SHA；每个 build job 成功后写自己的 `xn-built-<sha256>-<job>`
# 标记（下一轮 check 据此只跳完成的子任务）；仓库变量 XN_LAST_MAIN_SHA 只记录最近一次
# 三个普通档齐全的 main SHA（跳过构建不看它）—— GITHUB_TOKEN 写不了 Actions Variables，
# 会先试 secret XN_VARS_TOKEN（fine-grained，Variables: read/write），再复用 XN_REPO_TOKEN
# （classic PAT / repo scope 才能写本仓库变量），都不行只打 warning。
# 发布到上游 v<Cargo.toml version> release（需要写权限的 XN_REPO_TOKEN）。

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "true=即使 main SHA 未变化也编译；false=只在 main 有新提交时编译"
        type: choice
        options:
          - "false"
          - "true"
        default: "false"
      target:
        description: >-
          all=三个目标并发都编 | x86_64-linux-gnu=Ubuntu x86_64 原生 PGO |
          armv7-linux-musleabihf=Ubuntu 交叉 armv7（普通 release，无 PGO，只出 runtime 包） |
          aarch64-macos=macOS arm64 原生 PGO（BOLT 不可用）
        type: choice
        required: true
        default: all
        options:
          - all
          - x86_64-linux-gnu
          - armv7-linux-musleabihf
          - aarch64-macos
      compare:
        description: >-
          false=不跑 pgo.compare | true=构建后拿本轮普通 bin vs PGO bin 跑（不重编；macOS
          只比尺寸；armv7 不跑） | only=完全不构建，直接用已发布 runtime 包里的 bin 单独跑
        type: choice
        required: true
        default: "false"
        options:
          - "false"
          - "true"
          - only
      ref:
        description: 指定上游 ref（留空 = main）
        required: false
        default: ""
      tag:
        description: 目标 release tag（留空 = Cargo.toml 的 v<version>）
        required: false
        default: ""
      features:
        description: cargo features（留空 = 默认）
        required: false
        default: ""
  repository_dispatch:
    types: [xn-main-updated]

permissions:
  contents: read
  actions: write

concurrency:
  group: xn-pgo-bolt
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      ref: ${{ steps.resolve.outputs.ref }}
      target: ${{ steps.target.outputs.target }}
      cache_key: ${{ steps.marker.outputs.key }}
      changed: ${{ steps.decide.outputs.changed }}
      # compare=only 时用：从已发布的 runtime 包取 bin 的 release tag
      release_tag: ${{ steps.release.outputs.tag }}
      bins_x86_64: ${{ steps.bins.outputs.x86_64 }}
      bins_macos: ${{ steps.bins.outputs.macos }}
      # 每个 build job 单独决策：已完成的跳过，只编缺的（见「Decide which builds to run」）
      build_x86_64: ${{ steps.decide.outputs.build_x86_64 }}
      build_x86_64_tuned: ${{ steps.decide.outputs.build_x86_64_tuned }}
      build_armv7: ${{ steps.decide.outputs.build_armv7 }}
      build_macos: ${{ steps.decide.outputs.build_macos }}
      build_macos_tuned: ${{ steps.decide.outputs.build_macos_tuned }}
    steps:
      - name: Check XN_REPO_TOKEN
        env:
          GH_TOKEN: ${{ secrets.XN_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::需要仓库 secret XN_REPO_TOKEN（对 leptonyu/xn 至少 contents:write）"
            exit 1
          fi
          can_push="$(gh api repos/leptonyu/xn --jq .permissions.push)"
          if [ "$can_push" != "true" ]; then
            echo "::error::XN_REPO_TOKEN 对 leptonyu/xn 没有写权限；创建/更新 v<version> release 需要 contents:write"
            exit 1
          fi
      - name: Prepare private CI release（compare=true 的 bin / 报告中转）
        # public 仓库的 artifact 不能承载私有上游的产物。compare=true 的 bin / 对比报告
        # 走私有上游仓库里**一个固定 prerelease** `xn-ci`：每次 --clobber 覆盖，不会越积越多。
        # compare=only 不靠它取 bin（直接从发布包解），但报告归档仍需要这个 release 存在。
        env:
          GH_TOKEN: ${{ secrets.XN_REPO_TOKEN }}
        run: |
          set -euo pipefail
          gh release view xn-ci --repo leptonyu/xn >/dev/null 2>&1 && exit 0
          gh release create xn-ci --repo leptonyu/xn --prerelease \
            --title "xn CI 临时产物（pgo.compare）" \
            --notes "发布 workflow 的 compare 中转站：普通/tuned bin + 对比报告，每次 --clobber 覆盖。可随时删除，下次 compare 会重建。" \
            >/dev/null
      - name: Resolve target
        id: target
        env:
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          # schedule / repository_dispatch 没有 inputs：按 all 处理。
          echo "target=${INPUT_TARGET:-all}" >> "$GITHUB_OUTPUT"
      - name: Resolve upstream ref
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.XN_REPO_TOKEN }}
          INPUT_REF: ${{ inputs.ref }}
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          ref="${INPUT_REF:-main}"
          sha="${PAYLOAD_SHA:-}"
          if [ -z "$sha" ]; then
            sha="$(gh api --method GET repos/leptonyu/xn/commits \
              -f "sha=$ref" -f per_page=1 --jq ".[0].sha")"
          fi
          [ -n "$sha" ] || { echo "::error::解析不到 $ref 的 SHA"; exit 1; }
          {
            echo "sha=$sha"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"
      - name: Resolve release tag（compare=only 从发布包取 bin）
        id: release
        if: ${{ inputs.compare == 'only' }}
        env:
          GH_TOKEN: ${{ secrets.XN_REPO_TOKEN }}
          SHA: ${{ steps.resolve.outputs.sha }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then
            # 和 xn/fetch-bin.sh 一样从上游 Cargo.toml 读版本（workspace.package 优先）；
            # check 没有 checkout 上游，这里直接走 contents API 取原文。
            toml="$(gh api "repos/leptonyu/xn/contents/Cargo.toml?ref=$SHA" \
              -H "Accept: application/vnd.github.raw")" || {
              echo "::error::取不到上游 Cargo.toml（用 tag 输入显式指定发布 tag）"
              exit 1
            }
            cargo_version() { # $1 = workspace.package | package
              printf '%s\n' "$toml" | awk -v want="$1" '
                $0 == "[" want "]" { in_section = 1; next }
                in_section && /^\[/ { exit }
                in_section && /^[[:space:]]*version[[:space:]]*=/ {
                  line = $0
                  sub(/^[^=]*=[[:space:]]*/, "", line)
                  gsub(/["[:space:]]/, "", line)
                  print line
                  exit
                }
              '
            }
            version="$(cargo_version workspace.package)"
            [ -n "$version" ] || version="$(cargo_version package)"
            [ -n "$version" ] || {
              echo "::error::读不到上游 Cargo.toml 的版本，无法定位发布包；用 tag 输入显式指定"
              exit 1
            }
            tag="v$version"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Derive marker key
        id: marker
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          # 仓库是 public、上游是 private：key 里绝不能出现上游 SHA，否则等于公开私有提交号。
          # 用 SHA-256 摘要当 key（不可逆），标记文件内容也不写 SHA（各 build job 只写 "built"）。
          echo "key=$(printf '%s' "$SHA" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Prepare state dir
        run: mkdir -p .xn-built-sha
      # 每个 build job 一个标记（key = xn-built-<sha256>-<job>）。这里逐个 lookup，
      # 下面 decide 就能算出「哪个子任务已经完成」并只保留没完成的那几个。
      - name: Restore built marker（x86_64 普通）
        id: built-linux-x86_64
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: .xn-built-sha
          key: xn-built-${{ steps.marker.outputs.key }}-linux-x86_64
          lookup-only: true
      - name: Restore built marker（x86_64 PGO）
        id: built-linux-x86_64-tuned
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: .xn-built-sha
          key: xn-built-${{ steps.marker.outputs.key }}-linux-x86_64-tuned
          lookup-only: true
      - name: Restore built marker（armv7）
        id: built-linux-armv7
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: .xn-built-sha
          key: xn-built-${{ steps.marker.outputs.key }}-linux-armv7
          lookup-only: true
      - name: Restore built marker（macOS 普通）
        id: built-macos-aarch64
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: .xn-built-sha
          key: xn-built-${{ steps.marker.outputs.key }}-macos-aarch64
          lookup-only: true
      - name: Restore built marker（macOS PGO）
        id: built-macos-aarch64-tuned
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: .xn-built-sha
          key: xn-built-${{ steps.marker.outputs.key }}-macos-aarch64-tuned
          lookup-only: true
      - name: Decide which builds to run
        id: decide
        env:
          TARGET: ${{ steps.target.outputs.target }}
          REF: ${{ steps.resolve.outputs.ref }}
          FORCE: ${{ inputs.force || 'false' }}
          COMPARE: ${{ inputs.compare || 'false' }}
          MARKER_KEY: ${{ steps.marker.outputs.key }}
          HIT_X86_64: ${{ steps.built-linux-x86_64.outputs.cache-hit }}
          HIT_X86_64_TUNED: ${{ steps.built-linux-x86_64-tuned.outputs.cache-hit }}
          HIT_ARMV7: ${{ steps.built-linux-armv7.outputs.cache-hit }}
          HIT_MACOS: ${{ steps.built-macos-aarch64.outputs.cache-hit }}
          HIT_MACOS_TUNED: ${{ steps.built-macos-aarch64-tuned.outputs.cache-hit }}
        run: |
          set -euo pipefail
          target="${TARGET:-all}"
          # 标记按 build job 各一份：已完成的子任务不再重跑，只编缺的那些。
          # 非 main ref / force=true 时忽略标记（手动 force 一定重编，和之前一致）。
          honor=true
          if [ "$REF" != "main" ] || [ "$FORCE" = "true" ]; then honor=false; fi

          in_target() { case "$target" in all|"$1") return 0 ;; *) return 1 ;; esac; }
          need() { # need <target> <已构建> -> true=这个 job 要编
            if in_target "$1" && { [ "$honor" = false ] || [ "$2" = false ]; }; then
              echo true
            else
              echo false
            fi
          }

          built_x86_64=false built_x86_64_tuned=false built_armv7=false
          built_macos=false built_macos_tuned=false
          [ "${HIT_X86_64:-false}" = "true" ] && built_x86_64=true
          [ "${HIT_X86_64_TUNED:-false}" = "true" ] && built_x86_64_tuned=true
          [ "${HIT_ARMV7:-false}" = "true" ] && built_armv7=true
          [ "${HIT_MACOS:-false}" = "true" ] && built_macos=true
          [ "${HIT_MACOS_TUNED:-false}" = "true" ] && built_macos_tuned=true

          build_x86_64=false build_x86_64_tuned=false build_armv7=false
          build_macos=false build_macos_tuned=false
          # compare=only：本轮不构建，compare job 直接从发布包取 bin 跑 pgo.compare。
          if [ "$COMPARE" != "only" ]; then
            build_x86_64=$(need x86_64-linux-gnu "$built_x86_64")
            build_x86_64_tuned=$(need x86_64-linux-gnu "$built_x86_64_tuned")
            build_armv7=$(need armv7-linux-musleabihf "$built_armv7")
            build_macos=$(need aarch64-macos "$built_macos")
            build_macos_tuned=$(need aarch64-macos "$built_macos_tuned")
          fi

          changed=false
          for b in "$build_x86_64" "$build_x86_64_tuned" "$build_armv7" \
                   "$build_macos" "$build_macos_tuned"; do
            [ "$b" = "true" ] && changed=true
          done

          {
            echo "changed=$changed"
            echo "build_x86_64=$build_x86_64"
            echo "build_x86_64_tuned=$build_x86_64_tuned"
            echo "build_armv7=$build_armv7"
            echo "build_macos=$build_macos"
            echo "build_macos_tuned=$build_macos_tuned"
          } >> "$GITHUB_OUTPUT"

          list=""
          [ "$build_x86_64" = "true" ] && list="$list x86_64"
          [ "$build_x86_64_tuned" = "true" ] && list="$list x86_64-pgo"
          [ "$build_armv7" = "true" ] && list="$list armv7"
          [ "$build_macos" = "true" ] && list="$list macos"
          [ "$build_macos_tuned" = "true" ] && list="$list macos-pgo"
          # compare=true 依赖本轮 build 成功；如果标记全命中（无事可做），compare 不会跑。
          if [ "$COMPARE" = "true" ] && [ "$changed" = "false" ]; then
            echo "::warning::本轮没有要构建的 job（已构建标记都命中），compare=true 等不到本轮 bin、不会跑；要单独跑对比请用 compare=only"
          fi
          {
            echo "### upstream"
            echo "- ref: \`$REF\`"
            # 本仓库 public：summary 也不写上游 SHA，只写它的摘要前缀。
            echo "- sha: \`sha256:${MARKER_KEY:0:12}…\`"
            echo "- target: \`$target\`"
            echo "- compare: \`$COMPARE\`"
            echo "- 要编：\`${list:-无（已构建的跳过 / compare=only）}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 清点 compare 用的发布包（compare=only）
        id: bins
        if: ${{ inputs.compare == 'only' }}
        env:
          GH_TOKEN: ${{ secrets.XN_REPO_TOKEN }}
          TARGET: ${{ steps.target.outputs.target }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          # compare=only 不重编，也不要求 xn-ci 里有 bin：直接从发布 tag 的 runtime 包取。
          # 这里只清点哪一档的普通 + tuned 包都在，compare job 只跑齐的那档。
          assets="$(gh release view "$TAG" --repo leptonyu/xn --json assets --jq '.assets[].name' 2>/dev/null || true)"
          has() { grep -qxF -- "$1" <<<"$assets"; }
          x86_64=false
          macos=false
          if has "xn.x86_64-unknown-linux-gnu.tar.xz" &&
             has "xn.x86_64-unknown-linux-gnu.tuned.tar.xz"; then
            x86_64=true
          fi
          if has "xn.aarch64-apple-darwin.tar.xz" &&
             has "xn.aarch64-apple-darwin.tuned.tar.xz"; then
            macos=true
          fi
          {
            echo "x86_64=$x86_64"
            echo "macos=$macos"
          } >> "$GITHUB_OUTPUT"

          target="${TARGET:-all}"
          if [ "$target" = "armv7-linux-musleabihf" ]; then
            echo "::notice::armv7-linux-musleabihf 是交叉目标，没有同机 control / 采样；compare=only 不跑 pgo.compare"
            {
              echo "### compare 源（发布包）"
              echo "- tag: \`$TAG\`"
              echo "- armv7：不适用（交叉目标，没有同机 control / 采样）"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          want_x86=false
          want_macos=false
          case "$target" in all|x86_64-linux-gnu) want_x86=true ;; esac
          case "$target" in all|aarch64-macos) want_macos=true ;; esac
          missing=""
          if [ "$want_x86" = "true" ] && [ "$x86_64" != "true" ]; then
            missing="x86_64"
          fi
          if [ "$want_macos" = "true" ] && [ "$macos" != "true" ]; then
            if [ -n "$missing" ]; then
              missing="${missing}、macOS"
            else
              missing="macOS"
            fi
          fi
          # 明确点名了单个平台却缺包：直接报错，别让这一轮默默什么都不跑。
          if [ -n "$missing" ] && [ "$target" != "all" ]; then
            echo "::error::发布 $TAG 里没有完整的 ${missing} runtime 包（普通 + tuned）；compare=only 不重编，先跑一轮构建发布这个 tag，或用 tag 输入指定已有的发布"
            exit 1
          fi
          if [ "$x86_64" != "true" ] && [ "$macos" != "true" ]; then
            echo "::error::发布 $TAG 里一组 runtime 包都没有，compare=only 无从跑起；先跑一轮构建，或用 tag 输入指定已有的发布"
            exit 1
          fi
          if [ "$x86_64" != "true" ]; then
            echo "::warning::发布 $TAG 里没有完整的 x86_64 runtime 包；跳过这一档 compare"
          fi
          if [ "$macos" != "true" ]; then
            echo "::warning::发布 $TAG 里没有完整的 macOS runtime 包；跳过这一档 compare"
          fi
          {
            echo "### compare 源（发布包）"
            echo "- tag: \`$TAG\`"
            echo "- x86_64 runtime 包: \`$x86_64\`"
            echo "- macOS runtime 包: \`$macos\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- x86_64
  # 普通档和 tuned 档是**两个 job**：同时开跑，普通包先出；tuned 挂了也不影响普通包，
  # 更不阻塞 XN_LAST_MAIN_SHA 记账（只由三个普通档决定，见 record）。
  linux-x86_64:
    name: build x86_64-linux-gnu（普通）
    needs: check
    # check 已经按 job 判定「这个子任务要不要编」：标记命中（同一上游 SHA 编过）就跳过。
    if: needs.check.outputs.build_x86_64 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Checkout upstream xn
        uses: actions/checkout@v7
        with:
          repository: leptonyu/xn
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.XN_REPO_TOKEN }}
          path: .cache/xn-src
          fetch-depth: 1
          persist-credentials: false
      - name: Install system dependencies
        # 普通包只要编译器 + bindgen 这一套；perf / LLVM 23 / bolt-23 是 tuned job 才装的。
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake perl nasm \
            clang lld \
            libclang-dev libssl-dev zlib1g-dev liblzma-dev \
            curl git xz-utils file binutils python3 openssl lsb-release
      - name: Install Rust
        # 按仓库的 rust-toolchain.toml 装精确版本，避免 runner 预装的 rustc 和上游期望的不一致。
        run: |
          toolchain="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' "$GITHUB_WORKSPACE/.cache/xn-src/rust-toolchain.toml")"
          rustup set profile minimal
          rustup toolchain install "$toolchain"
          rustup default "$toolchain"
          rustup component add --toolchain "$toolchain" llvm-tools-preview
      - name: Install sccache
        # 只在本次 job 内复用（不跨 run 缓存，见文件头）：runner 结束即销毁。
        uses: taiki-e/install-action@sccache
      - name: Verify sccache
        run: |
          set -euo pipefail
          env_sh="$GITHUB_WORKSPACE/.cache/xn-src/scripts/cargo-env.sh"
          [[ -f "$env_sh" ]] || { echo "上游 checkout 里没有 scripts/cargo-env.sh"; exit 1; }
          source "$env_sh"
          echo "RUSTC_WRAPPER=${RUSTC_WRAPPER:-<unset>}"
          test "${RUSTC_WRAPPER:-}" = sccache
          sccache --version
          tmp="$(mktemp -d)"
          printf 'fn main() {}\n' > "$tmp/t.rs"
          RUSTC_WRAPPER=sccache rustc "$tmp/t.rs" -o "$tmp/t"
          "$tmp/t"
          sccache --show-stats | sed -n '1,6p'
          sccache --stop-server || true
      - name: Install cargo-deny
        # 打包要生成 THIRD-PARTY-NOTICES.txt（普通包也带）。
        uses: taiki-e/install-action@cargo-deny
      - name: 普通编译并上传
        env:
          GH_TOKEN: ${{ secrets.XN_REPO_TOKEN }}
          INPUT_FEATURES: ${{ inputs.features }}
          INPUT_TAG: ${{ inputs.tag }}
          SCCACHE_CACHE_SIZE: 1G
        run: |
          set -euo pipefail
          args=(
            --src "$GITHUB_WORKSPACE/.cache/xn-src"
            --target x86_64-unknown-linux-gnu
            --flavors release
            --publish
          )
          [ -n "${INPUT_TAG:-}" ] && args+=(--tag "$INPUT_TAG")
          [ -n "${INPUT_FEATURES:-}" ] && args+=(--features "$INPUT_FEATURES")
          ./xn/build.sh "${args[@]}"
      - name: 上传 bin 到私有 release（compare 用）
        # 不放 public artifact：这里传的是私有上游的二进制。
        # 每轮都传：compare=true / 报告归档都靠 xn-ci；compare=only 不走这里。
        # compare=true 时上传失败会红（对比要靠它）；其余时候只警告，不连累发布。
        continue-on-error: ${{ inputs.compare != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.XN_REPO_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(xn/dist/*.bin)
          (( ${#files[@]} )) || { echo "::warning::没有 .bin 产物，compare 会缺这一组"; exit 0; }
          for i in 1 2 3 4; do
            gh release upload xn-ci "${files[@]}" --repo leptonyu/xn --clobber && exit 0
            sleep $((i * 2))
          done
          # 传不上去就把同名旧 bin 删掉：否则 compare 可能拿到上一个 SHA 的旧 bin。
          for f in "${files[@]}"; do
            gh release delete-asset xn-ci "$(basename "$f")" --repo leptonyu/xn --yes \
              >/dev/null 2>&1 || true
          done
          echo "::error::上传 bin 到私有 release xn-ci 失败"
          exit 1
      - name: 记已构建标记（x86_64 普通）
        # 每个 build job 成功后各存一份标记：下一轮 check 只跳过已完成的子任务。
        # 只写固定字符串 —— cache 内容对 public 仓库可见，不能写上游 SHA / 源码。
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p .xn-built-sha
          printf 'built\n' > .xn-built-sha/linux-x86_64
      - name: Save built marker（x86_64 普通）
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .xn-built-sha
          key: xn-built-${{ needs.check.outputs.cache_key }}-linux-x86_64

  linux-x86_64-tuned:
    name: build x86_64-linux-gnu（PGO）
    needs: check
    if: needs.check.outputs.build_x86_64_tuned == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - name: Checkout upstream xn
        uses: actions/checkout@v7
        with:
          repository: leptonyu/xn
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.XN_REPO_TOKEN }}
          path: .cache/xn-src
          fetch-depth: 1
          persist-credentials: false
      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake perl nasm \
            clang lld \
            libclang-dev libssl-dev zlib1g-dev liblzma-dev \
            curl git xz-utils file binutils python3 openssl lsb-release
      - name: Install PGO/BOLT toolchain
        # tuned 档才要：perf 采样、LLVM 23 的 llvm-profdata / llvm-bolt、BOLT 用的 lld。
        run: |
          set -euo pipefail
          ./xn/install-perf.sh
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 23
          sudo apt-get install -y llvm-23 llvm-23-tools bolt-23 lld-23 clang-23
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"
          echo 'kernel.perf_event_paranoid=1' | sudo tee /etc/sysctl.d/99-xn-perf.conf >/dev/null
          sudo sysctl --system
          perf --version
          /usr/lib/llvm-23/bin/llvm-bolt --version
          # PGO 的唯一硬依赖；显式检查，别等 release.sh 的 doctor 才发现
          test -x /usr/lib/llvm-23/bin/llvm-profdata
          /usr/lib/llvm-23/bin/llvm-profdata --version
      - name: Install Rust
        run: |
          toolchain="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' "$GITHUB_WORKSPACE/.cache/xn-src/rust-toolchain.toml")"
          rustup set profile minimal
          rustup toolchain install "$toolchain"
          rustup default "$toolchain"
          rustup component add --toolchain "$toolchain" llvm-tools-preview
      - name: Install sccache
        # 只在本次 job 内复用（PGO 三阶段共享依赖编译）；不跨 run 缓存，见文件头。
        uses: taiki-e/install-action@sccache
      - name: Verify sccache
        run: |
          set -euo pipefail
          env_sh="$GITHUB_WORKSPACE/.cache/xn-src/scripts/cargo-env.sh"
          [[ -f "$env_sh" ]] || { echo "上游 checkout 里没有 scripts/cargo-env.sh"; exit 1; }
          source "$env_sh"
          test "${RUSTC_WRAPPER:-}" = sccache
          sccache --version
          # 让真正的构建从干净 server 起：SCCACHE_CACHE_SIZE=1G 才会生效。
          sccache --stop-server || true
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: Install cargo-nextest
        # PGO 采样默认要跑 nextest。
        uses: taiki-e/install-action@nextest
      - name: Verify PGO toolchain
        # 环境准备的最后一道门：doctor 直接判 PGO 可用性（target==host + llvm-profdata）。
        # 缺了就在这里红，不让 release.sh 走到「缺工具 → 降级普通 release」那条路。
        env:
          LLVM_PROFDATA: /usr/lib/llvm-23/bin/llvm-profdata
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/.cache/xn-src"
          ./scripts/build-tuned.sh doctor --target x86_64-unknown-linux-gnu --require pgo
      - name: PGO 优化并上传
        env:
          GH_TOKEN: ${{ secrets.XN_REPO_TOKEN }}
          LLVM_PROFDATA: /usr/lib/llvm-23/bin/llvm-profdata
          INPUT_FEATURES: ${{ inputs.features }}
          INPUT_TAG: ${{ inputs.tag }}
          SCCACHE_CACHE_SIZE: 1G
        run: |
          set -euo pipefail
          args=(
            --src "$GITHUB_WORKSPACE/.cache/xn-src"
            --target x86_64-unknown-linux-gnu
            --flavors tuned
            --publish
          )
          [ -n "${INPUT_TAG:-}" ] && args+=(--tag "$INPUT_TAG")
          [ -n "${INPUT_FEATURES:-}" ] && args+=(--features "$INPUT_FEATURES")
          ./xn/build.sh "${args[@]}"
      - name: 上传 bin 到私有 release（compare 用）
        # 不放 public artifact：这里传的是私有上游的二进制。
        # 每轮都传：compare=true / 报告归档都靠 xn-ci；compare=only 不走这里。
        # compare=true 时上传失败会红（对比要靠它）；其余时候只警告，不连累发布。
        continue-on-error: ${{ inputs.compare != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.XN_REPO_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(xn/dist/*.bin)
          (( ${#files[@]} )) || { echo "::warning::没有 .bin 产物，compare 会缺这一组"; exit 0; }
          for i in 1 2 3 4; do
            gh release upload xn-ci "${files[@]}" --repo leptonyu/xn --clobber && exit 0
            sleep $((i * 2))
          done
          # 传不上去就把同名旧 bin 删掉：否则 compare 可能拿到上一个 SHA 的旧 bin。
          for f in "${files[@]}"; do
            gh release delete-asset xn-ci "$(basename "$f")" --repo leptonyu/xn --yes \
              >/dev/null 2>&1 || true
          done
          echo "::error::上传 bin 到私有 release xn-ci 失败"
          exit 1
      - name: 记已构建标记（x86_64 PGO）
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p .xn-built-sha
          printf 'built\n' > .xn-built-sha/linux-x86_64-tuned
      - name: Save built marker（x86_64 PGO）
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .xn-built-sha
          key: xn-built-${{ needs.check.outputs.cache_key }}-linux-x86_64-tuned

  linux-armv7:
    name: build armv7-linux-musleabihf
    # 跟 x86_64 / macOS 一样只看 check：三档同时开跑，armv7 不排在 x86_64 后面等任何东西。
    # armv7 走普通 release 交叉编译（无 PGO/BOLT），不需要 profile。
    needs: check
    if: needs.check.outputs.build_armv7 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      # 交叉档只编一次，sccache 的下载/启动（macOS 的 SUN_LEN、GitHub release 504）
      # 不值得再引入一个失败点；这里连 job 内缓存也不用。
      XN_SCCACHE: "off"
    steps:
      - uses: actions/checkout@v7
      - name: Checkout upstream xn
        uses: actions/checkout@v7
        with:
          repository: leptonyu/xn
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.XN_REPO_TOKEN }}
          path: .cache/xn-src
          fetch-depth: 1
          persist-credentials: false
      - name: Install system dependencies
        # 交叉档的 C 依赖由 cargo-zigbuild 用 zig cc 编；这里只装 bindgen（libclang）与
        # release.sh --pack 需要的工具，不装 perf / LLVM 23 / BOLT。
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake perl nasm \
            clang lld libclang-dev libssl-dev zlib1g-dev liblzma-dev \
            curl git xz-utils file binutils python3 openssl
      - name: Install Rust
        run: |
          toolchain="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' "$GITHUB_WORKSPACE/.cache/xn-src/rust-toolchain.toml")"
          rustup set profile minimal
          rustup toolchain install "$toolchain"
          rustup default "$toolchain"
          rustup target add --toolchain "$toolchain" armv7-unknown-linux-musleabihf
      - name: Install cargo-deny
        # release.sh --pack 会调 gen-notices.sh（需要 cargo-deny）。
        uses: taiki-e/install-action@cargo-deny
      - name: Build armv7 (plain release) and publish
        env:
          GH_TOKEN: ${{ secrets.XN_REPO_TOKEN }}
          INPUT_FEATURES: ${{ inputs.features }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          args=(
            --src "$GITHUB_WORKSPACE/.cache/xn-src"
            --target armv7-unknown-linux-musleabihf
            --publish
          )
          [ -n "${INPUT_TAG:-}" ] && args+=(--tag "$INPUT_TAG")
          [ -n "${INPUT_FEATURES:-}" ] && args+=(--features "$INPUT_FEATURES")
          ./xn/build.sh "${args[@]}"
      - name: pgo.compare not applicable
        if: ${{ inputs.compare == 'true' }}
        run: |
          echo "::notice::armv7-linux-musleabihf 是交叉目标，没有同机 control / profile 采样；pgo.compare 只在 x86_64 / macOS 原生任务上跑"
      - name: 记已构建标记（armv7）
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p .xn-built-sha
          printf 'built\n' > .xn-built-sha/linux-armv7
      - name: Save built marker（armv7）
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .xn-built-sha
          key: xn-built-${{ needs.check.outputs.cache_key }}-linux-armv7

