            --src "$GITHUB_WORKSPACE/.cache/xn-src"
            --target aarch64-apple-darwin
            --flavors tuned
            --publish
          )
          [ -n "${INPUT_TAG:-}" ] && args+=(--tag "$INPUT_TAG")
          [ -n "${INPUT_FEATURES:-}" ] && args+=(--features "$INPUT_FEATURES")
          ./xn/build.sh "${args[@]}"
      - name: 上传 bin 到私有 release（compare 用）
        # 不放 public artifact：这里传的是私有上游的二进制。
        # 每轮都传：compare=true / 报告归档都靠 xn-ci；compare=only 不走这里。
        # compare=true 时上传失败会红（对比要靠它）；其余时候只警告，不连累发布。
        continue-on-error: ${{ inputs.compare != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.XN_REPO_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(xn/dist/*.bin)
          (( ${#files[@]} )) || { echo "::warning::没有 .bin 产物，compare 会缺这一组"; exit 0; }
          for i in 1 2 3 4; do
            gh release upload xn-ci "${files[@]}" --repo leptonyu/xn --clobber && exit 0
            sleep $((i * 2))
          done
          # 传不上去就把同名旧 bin 删掉：否则 compare 可能拿到上一个 SHA 的旧 bin。
          for f in "${files[@]}"; do
            gh release delete-asset xn-ci "$(basename "$f")" --repo leptonyu/xn --yes \
              >/dev/null 2>&1 || true
          done
          echo "::error::上传 bin 到私有 release xn-ci 失败"
          exit 1
      - name: 记已构建标记（macOS PGO）
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p .xn-built-sha
          printf 'built\n' > .xn-built-sha/macos-aarch64-tuned
      - name: Save built marker（macOS PGO）
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .xn-built-sha
          key: xn-built-${{ needs.check.outputs.cache_key }}-macos-aarch64-tuned

  # ---------------------------------------------------------------- compare
  linux-compare:
    name: pgo.compare x86_64（不重编）
    # 普通 bin 和 tuned bin 分属两个 job，这里把两边的 bin 凑到一起再做同机 A/B；
    # public artifact 不放私有产物。
    #   compare=true：两档 build 都成功、或标记命中已构建（skipped）后跑；skipped 的档用
    #                 xn-ci 里上次传的 bin（同一 SHA；bin 不全会下载失败，用 force=true 重编）；
    #   compare=only：不构建，从已发布 runtime 包解出 bin —— check 已确认这一档包齐。
    needs: [check, linux-x86_64, linux-x86_64-tuned]
    if: |
      always() &&
      needs.check.result == 'success' &&
      (needs.check.outputs.target == 'all' || needs.check.outputs.target == 'x86_64-linux-gnu') &&
      (
        (inputs.compare == 'only' && needs.check.outputs.bins_x86_64 == 'true') ||
        (inputs.compare == 'true' &&
         (needs.linux-x86_64.result == 'success' || needs.linux-x86_64.result == 'skipped') &&
         (needs.linux-x86_64-tuned.result == 'success' || needs.linux-x86_64-tuned.result == 'skipped') &&
         (needs.linux-x86_64.result == 'success' || needs.linux-x86_64-tuned.result == 'success'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Checkout upstream xn
        uses: actions/checkout@v7
        with:
          repository: leptonyu/xn
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.XN_REPO_TOKEN }}
          path: .cache/xn-src
          fetch-depth: 1
          persist-credentials: false
      - name: 准备 compare 的 bin（only=发布包 / true=xn-ci）
        env:
          GH_TOKEN: ${{ secrets.XN_REPO_TOKEN }}
          COMPARE: ${{ inputs.compare }}
          TAG: ${{ needs.check.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p xn/dist
          if [ "$COMPARE" = "only" ]; then
            echo "::notice::compare=only：从发布 $TAG 的 runtime 包解出两档 bin（不重编）"
            ./xn/fetch-bin.sh \
              --src "$GITHUB_WORKSPACE/.cache/xn-src" \
              --target x86_64-unknown-linux-gnu \
              --tag "$TAG"
          else
            gh release download xn-ci --repo leptonyu/xn \
              --pattern 'xn.x86_64-unknown-linux-gnu.*.bin' --dir xn/dist --clobber || true
            for f in xn.x86_64-unknown-linux-gnu.release.bin xn.x86_64-unknown-linux-gnu.tuned.bin; do
              if [ ! -f "xn/dist/$f" ]; then
                echo "::error::xn-ci 里缺 $f：compare=true 时某一档若是 skipped，说明它上次的 bin 不在中转 release；用 force=true 重编这一档，或先跑一轮构建"
                exit 1
              fi
            done
          fi
          ls -l xn/dist
      - name: Run pgo.compare（普通 bin vs PGO bin，不重编）
        run: |
          set -euo pipefail
          ./xn/compare.sh \
            --src "$GITHUB_WORKSPACE/.cache/xn-src" \
            --target x86_64-unknown-linux-gnu \
            --rounds 6
      - name: 对比报告归档到私有 release
        # 报告里有私有代码的符号/函数名，不能进 public artifact。
        if: always()
        env:
          GH_TOKEN: ${{ secrets.XN_REPO_TOKEN }}
        run: |
          set -euo pipefail
          args=()
          for d in target/test-runs target/pgo; do
            if [[ -d ".cache/xn-src/$d" ]]; then args+=("$d"); fi
          done
          (( ${#args[@]} )) || { echo "没有 compare 产物，跳过"; exit 0; }
          tar -czf "compare-x86_64-linux-gnu.tar.gz" -C .cache/xn-src "${args[@]}"
          for i in 1 2 3 4; do
            gh release upload xn-ci "compare-x86_64-linux-gnu.tar.gz" --repo leptonyu/xn --clobber && exit 0
            sleep $((i * 2))
          done
          echo "::error::上传对比报告失败"
          exit 1

  macos-compare:
    name: pgo.compare aarch64-macos（只比尺寸，不重编）
    # macOS 产物是 Mach-O，Linux perf rig 跑不了：只比两个 bin 的大小，同样不重编。
    #   compare=true：两档 build 都成功、或标记命中已构建（skipped）后跑；skipped 的档用
    #                 xn-ci 里上次传的 bin（同一 SHA；bin 不全会下载失败，用 force=true 重编）；
    #   compare=only：从已发布 runtime 包解出 bin，check 已确认这一档包齐。
    needs: [check, macos-aarch64, macos-aarch64-tuned]
    if: |
      always() &&
      needs.check.result == 'success' &&
      (needs.check.outputs.target == 'all' || needs.check.outputs.target == 'aarch64-macos') &&
      (
        (inputs.compare == 'only' && needs.check.outputs.bins_macos == 'true') ||
        (inputs.compare == 'true' &&
         (needs.macos-aarch64.result == 'success' || needs.macos-aarch64.result == 'skipped') &&
         (needs.macos-aarch64-tuned.result == 'success' || needs.macos-aarch64-tuned.result == 'skipped') &&
         (needs.macos-aarch64.result == 'success' || needs.macos-aarch64-tuned.result == 'success'))
      )
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Checkout upstream xn
        uses: actions/checkout@v7
        with:
          repository: leptonyu/xn
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.XN_REPO_TOKEN }}
          path: .cache/xn-src
          fetch-depth: 1
          persist-credentials: false
      - name: 准备 compare 的 bin（only=发布包 / true=xn-ci）
        env:
          GH_TOKEN: ${{ secrets.XN_REPO_TOKEN }}
          COMPARE: ${{ inputs.compare }}
          TAG: ${{ needs.check.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p xn/dist
          if [ "$COMPARE" = "only" ]; then
            echo "::notice::compare=only：从发布 $TAG 的 runtime 包解出两档 bin（不重编）"
            ./xn/fetch-bin.sh \
              --src "$GITHUB_WORKSPACE/.cache/xn-src" \
              --target aarch64-apple-darwin \
              --tag "$TAG"
          else
            gh release download xn-ci --repo leptonyu/xn \
              --pattern 'xn.aarch64-apple-darwin.*.bin' --dir xn/dist --clobber || true
            for f in xn.aarch64-apple-darwin.release.bin xn.aarch64-apple-darwin.tuned.bin; do
              if [ ! -f "xn/dist/$f" ]; then
                echo "::error::xn-ci 里缺 $f：compare=true 时某一档若是 skipped，说明它上次的 bin 不在中转 release；用 force=true 重编这一档，或先跑一轮构建"
                exit 1
              fi
            done
          fi
          ls -l xn/dist
      - name: Run pgo.compare (size-only on macOS)
        run: |
          set -euo pipefail
          ./xn/compare.sh \
            --src "$GITHUB_WORKSPACE/.cache/xn-src" \
            --target aarch64-apple-darwin \
            --size-only \
            --rounds 6
      - name: 对比报告归档到私有 release
        # 报告里有私有代码的符号/函数名，不能进 public artifact。
        if: always()
        env:
          GH_TOKEN: ${{ secrets.XN_REPO_TOKEN }}
        run: |
          set -euo pipefail
          args=()
          for d in target/test-runs target/pgo; do
            if [[ -d ".cache/xn-src/$d" ]]; then args+=("$d"); fi
          done
          (( ${#args[@]} )) || { echo "没有 compare 产物，跳过"; exit 0; }
          tar -czf "compare-aarch64-macos.tar.gz" -C .cache/xn-src "${args[@]}"
          for i in 1 2 3 4; do
            gh release upload xn-ci "compare-aarch64-macos.tar.gz" --repo leptonyu/xn --clobber && exit 0
            sleep $((i * 2))
          done
          echo "::error::上传对比报告失败"
          exit 1

  # ---------------------------------------------------------------- docker
  # 镜像：用**上游自带的 Dockerfile**（上游根目录的 `Dockerfile` / `Dockerfile.armv7`）
  # 把 xn 做成容器镜像推到 ghcr.io（`IMAGE`，包名 `xn`）：
  #   - `Dockerfile`       → linux/amd64，`FROM debian:trixie-slim`（glibc 档）
  #   - `Dockerfile.armv7` → linux/arm/v7，`FROM arm32v7/debian:trixie-slim`
  # 两个都是**运行镜像**（只 COPY 产物、不编译），要的路径就是上游 CI 的布局：
  #   target/<triple>/release/xn、target/THIRD-PARTY-NOTICES.txt、entry.sh、LICENSE、
  #   x86 那份还要 dlc.dat.xz。所以先把这些摆进上游 checkout，再 `docker build`：
  #   - amd64：从发布包 `xn.x86_64-unknown-linux-gnu.tar.xz` 解出 `xn` /
  #     `THIRD-PARTY-NOTICES.txt`（与 release 里的二进制逐字节一致），先校验 .sha256sum；
  #   - armv7：直接用发布包 `xn.armv7-unknown-linux-musleabihf.tar.xz` 里的 musl 静态
  #     二进制（不另编 gnu 档，省一次交叉编译）。注意 `Dockerfile.armv7` 里 COPY 的路径
  #     写的是 `target/armv7-unknown-linux-gnueabihf/release/xn` —— 那只是个 COPY 路径，
  #     放 musl 静态二进制在 arm32v7/debian 上照样跑。
  #     **代价**：musl 分配器在高 churn 下只涨不还（上游 docs/datapath-perf.md §2.30，
  #     当年正是因为它在容器里 OOM 才换的 glibc 档）。要回到 glibc 就把这一步换回
  #     `release.sh --target armv7-unknown-linux-gnueabihf`（多一次交叉编译）；
  #   - `dlc.dat.xz`：优先用上游 `scripts/test/fixtures.lock.toml` 的 `[dlc]` 钉的
  #     dockerized-packages release 制品（按里面的 sha256 校验）；那个 tag 会被
  #     delete-releases.yml 按保留策略删掉（取不到 404），所以取不到/校验不过时退回
  #     dockerized-packages 最新 release（和运行时默认同一源）。
  #
  # 和 cache / artifact 一样，镜像也不能把私有上游的东西放进 public 存储：
  #   - **不配 buildx 缓存**（`type=gha` 缓存里就是私有源码编出来的层）；
  #   - **不开 provenance / sbom**（attestation 会写 VCS 来源 = 上游仓库和提交）；
  #   - 只按 digest 推送，最后合并 manifest，不产生一堆 per-arch tag；
  #   - 不写 `org.opencontainers.image.revision`（那是上游 SHA）。
  # 所以 `IMAGE` 所在的 ghcr 包**必须保持 private**（job 末尾查一次可见性，public 会警告）。
  #
  # 触发：本轮至少编出一个普通档才推（镜像跟着 release 走，不是每小时重建；两档都
  # skipped 不触发，要重推就 force=true）。按 `target` 决定推哪几档：`all`（默认）两档
  # 都建，拼成一个多架构 manifest（`v<version>`，两档齐了再加 `latest`）；只点名一个
  # 平台就只推那一档。普通档有失败时整档跳过 —— 免得把「只有一半」的 manifest 盖到
  # `v<version>` / `latest` 上。
  docker:
    name: push ghcr.io/leptonyu/xn
    needs: [check, linux-x86_64, linux-armv7]
    if: |
      always() &&
      needs.check.result == 'success' &&
      inputs.compare != 'only' &&
      (needs.linux-x86_64.result == 'success' || needs.linux-x86_64.result == 'skipped') &&
      (needs.linux-armv7.result == 'success' || needs.linux-armv7.result == 'skipped') &&
      (needs.linux-x86_64.result == 'success' || needs.linux-armv7.result == 'success')
    runs-on: ubuntu-latest
    # 只是取包 + COPY：不再编任何东西，十几分钟足够。
    timeout-minutes: 60
    permissions:
      # 推 ghcr 要 packages: write；checkout 私有上游用 XN_REPO_TOKEN（这一档只需要读）。
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/leptonyu/xn
      PACKAGE: xn
      DOCKERFILE_X86: Dockerfile
      DOCKERFILE_ARM: Dockerfile.armv7
      PLATFORM_X86: linux/amd64
      PLATFORM_ARM: linux/arm/v7
      # Dockerfile 里 COPY 的路径由上游定死，改不了；要跟着上游布局走。
      TRIPLE_X86: x86_64-unknown-linux-gnu
      # TRIPLE_ARM 是 `Dockerfile.armv7` 里 COPY 的**路径**（上游写的是 gnueabihf），
      # TRIPLE_ARM_PKG 才是发布包里实际那一档（musleabihf）。
      TRIPLE_ARM: armv7-unknown-linux-gnueabihf
      TRIPLE_ARM_PKG: armv7-unknown-linux-musleabihf
    steps:
      - name: Checkout upstream xn
        # 和 build job 用同一个 XN_REPO_TOKEN：这一档只要 contents: read（整个 token 在
        # release 那边仍需要 contents: write，所以不用为镜像改权限）。
        # token 只用于 checkout，不进镜像构建；ghcr 推送走 GITHUB_TOKEN + packages: write。
        uses: actions/checkout@v7
        with:
          repository: leptonyu/xn
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.XN_REPO_TOKEN }}
          path: .cache/xn-src
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve version / tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          src="$GITHUB_WORKSPACE/.cache/xn-src"
          # 版本和 build.sh 一致：workspace.package 优先，没有再退回 package。
          cargo_version() { # $1 = workspace.package | package
            awk -v want="$1" '
              $0 == "[" want "]" { in_section = 1; next }
              in_section && /^\[/ { exit }
              in_section && /^[[:space:]]*version[[:space:]]*=/ {
                line = $0
                sub(/^[^=]*=[[:space:]]*/, "", line)
                gsub(/["[:space:]]/, "", line)
                print line
                exit
              }
            ' "$src/Cargo.toml"
          }
          version="$(cargo_version workspace.package)"
          [ -n "$version" ] || version="$(cargo_version package)"
          [ -n "$version" ] || { echo "::error::读不到上游 Cargo.toml 的版本"; exit 1; }
          tag="${INPUT_TAG:-v$version}"
          # 两个 Dockerfile 是这一档的入口：上游换布局就红在这里，别静默跳过镜像。
          for f in "$DOCKERFILE_X86" "$DOCKERFILE_ARM"; do
            if [[ ! -f "$src/$f" ]]; then
              echo "::error::上游 checkout 里没有 $f（镜像构建入口）；上游改了布局就改 DOCKERFILE_*"
              ls -la "$src" >&2 || true
              exit 1
            fi
          done
          {
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### ghcr.io"
            echo "- 版本: \`$tag\`"
            echo "- amd64: \`$DOCKERFILE_X86\`（linux/amd64）"
            echo "- armv7: \`$DOCKERFILE_ARM\`（linux/arm/v7）"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 取 amd64 二进制（发布包，与 release 逐字节一致）
        if: needs.linux-x86_64.result == 'success' || needs.check.outputs.target == 'all'
        env:
          GH_TOKEN: ${{ secrets.XN_REPO_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          src="$GITHUB_WORKSPACE/.cache/xn-src"
          work="$RUNNER_TEMP/pkg-x86"
          mkdir -p "$work"
          asset="xn.$TRIPLE_X86.tar.xz"
          gh release download "$TAG" --repo leptonyu/xn \
            --pattern "$asset*" --dir "$work" --clobber \
            || { echo "::error::取不到 $TAG 的 $asset（发布包没上传成功？）"; exit 1; }
          ( cd "$work" && sha256sum -c "$asset.sha256sum" )
          tar -xf "$work/$asset" -C "$work"
          for f in xn THIRD-PARTY-NOTICES.txt; do
            [[ -f "$work/$f" ]] || {
              echo "::error::$asset 里没有 $f（Dockerfile 要 COPY 它；老包可能不带随附声明）"
              tar -tJf "$work/$asset" >&2 || true
              exit 1
            }
          done
          # 路径就是上游 Dockerfile 里 COPY 的那两条（布局定死，不猜）。
          mkdir -p "$src/target/$TRIPLE_X86/release"
          cp "$work/xn" "$src/target/$TRIPLE_X86/release/xn"
          chmod 0755 "$src/target/$TRIPLE_X86/release/xn"
          cp "$work/THIRD-PARTY-NOTICES.txt" "$src/target/THIRD-PARTY-NOTICES.txt"
          ls -l "$src/target/$TRIPLE_X86/release/xn" "$src/target/THIRD-PARTY-NOTICES.txt"
      - name: 取 armv7 二进制（发布包，musl 静态）
        if: needs.linux-armv7.result == 'success' || needs.check.outputs.target == 'all'
        env:
          GH_TOKEN: ${{ secrets.XN_REPO_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          src="$GITHUB_WORKSPACE/.cache/xn-src"
          work="$RUNNER_TEMP/pkg-arm"
          mkdir -p "$work"
          asset="xn.$TRIPLE_ARM_PKG.tar.xz"
          gh release download "$TAG" --repo leptonyu/xn \
            --pattern "$asset*" --dir "$work" --clobber \
            || { echo "::error::取不到 $TAG 的 $asset（发布包没上传成功？）"; exit 1; }
          ( cd "$work" && sha256sum -c "$asset.sha256sum" )
          tar -xf "$work/$asset" -C "$work"
          for f in xn THIRD-PARTY-NOTICES.txt; do
            [[ -f "$work/$f" ]] || {
              echo "::error::$asset 里没有 $f（Dockerfile 要 COPY 它；老包可能不带随附声明）"
              tar -tJf "$work/$asset" >&2 || true
              exit 1
            }
          done
          # 路径按 `Dockerfile.armv7` 的 COPY（写的是 gnueabihf，内容其实是 musl 静态二进制）；
          # notices 与 amd64 那份同源，这里也摆一遍（只跑 armv7 时也要有）。
          mkdir -p "$src/target/$TRIPLE_ARM/release"
          cp "$work/xn" "$src/target/$TRIPLE_ARM/release/xn"
          chmod 0755 "$src/target/$TRIPLE_ARM/release/xn"
          cp "$work/THIRD-PARTY-NOTICES.txt" "$src/target/THIRD-PARTY-NOTICES.txt"
          file "$src/target/$TRIPLE_ARM/release/xn" || true
          ls -l "$src/target/$TRIPLE_ARM/release/xn"
      - name: 准备 dlc.dat.xz（Dockerfile 会 COPY 它）
        # 先用上游 fixtures.lock.toml 钉的那份（可复现，带 sha256）；钉的 tag 会被
        # delete-releases.yml 按保留策略删掉（老 tag 取不到 404），所以取不到/校验不过时
        # 退回 dockerized-packages 最新 release —— 和运行时默认同一个源。
        run: |
          set -euo pipefail
          src="$GITHUB_WORKSPACE/.cache/xn-src"
          lock="$src/scripts/test/fixtures.lock.toml"
          section_value() { # <toml> <section> <key>
            awk -v want="$2" -v key="$3" '
              $0 == "[" want "]" { inside = 1; next }
              inside && /^\[/ { exit }
              inside && $1 == key {
                line = $0
                sub(/^[^=]*=[[:space:]]*/, "", line)
                gsub(/^"|"[[:space:]]*$/, "", line)
                print line
                exit
              }
            ' "$1"
          }
          fetch_dlc() { # <url> <sha256|空>：下载成功（且有 sha 时校验通过）返回 0
            local url="$1" want="$2"
            curl -fsSL --retry 3 --retry-delay 2 -o "$src/dlc.dat.xz" "$url" || return 1
            [[ -s "$src/dlc.dat.xz" ]] || return 1
            if [[ -n "$want" ]]; then
              printf '%s  dlc.dat.xz\n' "$want" | ( cd "$src" && sha256sum -c - ) || return 1
            fi
            return 0
          }

          url="" sha=""
          if [[ -f "$lock" ]]; then
            url="$(section_value "$lock" dlc url)"
            sha="$(section_value "$lock" dlc sha256)"
          fi
          if [[ -n "$url" ]] && fetch_dlc "$url" "$sha" 2>/dev/null; then
            echo "dlc.dat.xz 来自上游锁文件（已校验 sha256）：$url"
          else
            latest="https://github.com/leptonyu/dockerized-packages/releases/latest/download/dlc.dat.xz"
            echo "::warning::锁文件那份 dlc.dat.xz 取不到或校验不过（${url:-锁里没有 [dlc]}），退回最新 release：$latest"
            fetch_dlc "$latest" "" || {
              echo "::error::连 dockerized-packages 最新 release 的 dlc.dat.xz 都取不到"
              exit 1
            }
            echo "dlc.dat.xz 来自最新 release（没有锁文件 sha 可校验）：$latest"
          fi
          ls -l "$src/dlc.dat.xz"
      - name: Set up QEMU
        # arm/v7 的层要在 amd64 runner 上展开/执行，没有 binfmt 会 "exec format error"。
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push amd64（按 digest）
        id: image_x86
        if: needs.linux-x86_64.result == 'success' || needs.check.outputs.target == 'all'
        run: |
          set -euo pipefail
          meta="$RUNNER_TEMP/image-x86.json"
          # push-by-digest：不落 per-arch tag，最后只用 digest 合并 manifest。
          docker buildx build \
            --file ".cache/xn-src/$DOCKERFILE_X86" \
            --platform "$PLATFORM_X86" \
            --provenance=false \
            --sbom=false \
            --output "type=image,name=$IMAGE,push-by-digest=true,push=true" \
            --metadata-file "$meta" \
            ".cache/xn-src"
          digest="$(jq -r '."containerimage.digest" // empty' "$meta")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::拿不到有效的 amd64 digest（${digest:-空}）"
            exit 1
          }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "- amd64: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Build & push armv7（按 digest）
        id: image_arm
        if: needs.linux-armv7.result == 'success' || needs.check.outputs.target == 'all'
        run: |
          set -euo pipefail
          meta="$RUNNER_TEMP/image-arm.json"
          docker buildx build \
            --file ".cache/xn-src/$DOCKERFILE_ARM" \
            --platform "$PLATFORM_ARM" \
            --provenance=false \
            --sbom=false \
            --output "type=image,name=$IMAGE,push-by-digest=true,push=true" \
            --metadata-file "$meta" \
            ".cache/xn-src"
          digest="$(jq -r '."containerimage.digest" // empty' "$meta")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::拿不到有效的 armv7 digest（${digest:-空}）"
            exit 1
          }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "- armv7: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
      - name: 合并 manifest 并打 tag（v<version>，两档齐了再加 latest）
        # 不开 if：前面任一 build 失败时这一步自动跳过，免得把「只有一半」的 manifest
        # 盖到已发布的 tag 上。
        env:
          X86_DIGEST: ${{ steps.image_x86.outputs.digest }}
          ARM_DIGEST: ${{ steps.image_arm.outputs.digest }}
          VERSION_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          sources=()
          platforms=""
          if [[ -n "$X86_DIGEST" ]]; then
            sources+=("$IMAGE@$X86_DIGEST")
            platforms="linux/amd64"
          fi
          if [[ -n "$ARM_DIGEST" ]]; then
            sources+=("$IMAGE@$ARM_DIGEST")
            platforms="${platforms:+$platforms、}linux/arm/v7"
          fi
          if (( ${#sources[@]} == 0 )); then
            echo "::notice::没有镜像 digest（两档都没建），跳过 manifest 合并"
            exit 0
          fi
          names=("$IMAGE:$VERSION_TAG")
          # latest 只在两档都在时动：单平台 run 不该把 latest 换成单架构 manifest。
          if [[ -n "$X86_DIGEST" && -n "$ARM_DIGEST" ]]; then
            names+=("$IMAGE:latest")
          fi
          creates=()
          for n in "${names[@]}"; do creates+=(--tag "$n"); done
          docker buildx imagetools create "${creates[@]}" "${sources[@]}"
          for n in "${names[@]}"; do
            docker buildx imagetools inspect "$n" | sed -n '1,24p'
          done
          tags_text="\`$VERSION_TAG\`"
          (( ${#names[@]} > 1 )) && tags_text="$tags_text、\`latest\`"
          {
            echo "### ghcr 推送完成"
            echo "- 镜像: \`$IMAGE\`"
            echo "- tags: $tags_text"
            echo "- 平台: $platforms"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 检查 ghcr 包可见性
        # 镜像里是私有上游编出来的 xn：包设成 public 就等于把私有产物发出去。
        # 只查不改（可见性要在包的设置里改）。查不到（token 没 read:packages）只提示。
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          visibility="$(gh api "/user/packages/container/$PACKAGE" --jq .visibility 2>/dev/null || true)"
          case "$visibility" in
            private)
              echo "ok：ghcr.io/.../$PACKAGE 是 private"
              echo "- 可见性: \`private\`" >> "$GITHUB_STEP_SUMMARY"
              ;;
            public)
              echo "::warning::ghcr 包 $PACKAGE 是 public：镜像是私有上游 leptonyu/xn 编出来的 xn，任何人都能拉。要守住「私有产物不外流」就把它改回 private（包的设置页）。"
              echo "- 可见性: \`public\`（⚠️ 私有产物对外可见）" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::notice::查不到 ghcr 包 $PACKAGE 的可见性（${visibility:-空}）；GITHUB_TOKEN 可能没有 read:packages，手动确认包是 private"
              ;;
          esac

  # ---------------------------------------------------------------- record
  # 记账只看**普通档**（x86_64 / armv7 / macOS 三个 job）：tuned 是独立 job，挂了不影响
  # 普通包发布，也不阻塞 XN_LAST_MAIN_SHA。已构建标记按 job 独立，失败/没跑的 job 下一轮
  # check 会接着补（不必等上游下一次提交）；想一次全重编就手动 dispatch（force=true）。
  record:
    name: record built main SHA
    needs: [check, linux-x86_64, linux-armv7, macos-aarch64]
    if: |
      always() &&
      needs.check.result == 'success' &&
      inputs.compare != 'only' &&
      needs.check.outputs.changed == 'true' &&
      needs.check.outputs.ref == 'main' &&
      needs.check.outputs.target == 'all' &&
      (needs.linux-x86_64.result == 'success' || needs.linux-x86_64.result == 'skipped') &&
      (needs.linux-armv7.result == 'success' || needs.linux-armv7.result == 'skipped') &&
      (needs.macos-aarch64.result == 'success' || needs.macos-aarch64.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Record built main SHA
        continue-on-error: true
        env:
          # GITHUB_TOKEN 写不了 Actions Variables（即使 actions: write 也是 403），所以：
          #   1) 优先 XN_VARS_TOKEN（fine-grained PAT，Variables: read/write，最小权限）；
          #   2) 没配就复用 XN_REPO_TOKEN —— 它是 classic PAT（repo scope）时能写本仓库变量；
          #      只授了 leptonyu/xn 的 fine-grained token 会 403，只打 warning。
          # 跳过构建始终看每个 build job 自己的 cache 标记（xn-built-<sha256>-<job>）；
          # 这个变量只是「最近一次三个普通档齐全的 main SHA」记录，不参与判定。
          XN_VARS_TOKEN: ${{ secrets.XN_VARS_TOKEN }}
          XN_REPO_TOKEN: ${{ secrets.XN_REPO_TOKEN }}
          SHA: ${{ needs.check.outputs.sha }}
          SHA_DIGEST: ${{ needs.check.outputs.cache_key }}
        run: |
          set -uo pipefail
          got=""
          used=""
          for name in XN_VARS_TOKEN XN_REPO_TOKEN; do
            tok="$(printenv "$name" 2>/dev/null || true)"
            [[ -n "$tok" ]] || continue
            if GH_TOKEN="$tok" gh variable set XN_LAST_MAIN_SHA \
              --repo "$GITHUB_REPOSITORY" --body "$SHA" >/dev/null 2>&1; then
              got="$(GH_TOKEN="$tok" gh api \
                "repos/${GITHUB_REPOSITORY}/actions/variables/XN_LAST_MAIN_SHA" \
                --jq .value 2>/dev/null || true)"
              used="$name"
              [[ "$got" == "$SHA" ]] && break
            fi
          done
          var_state="未更新"
          [[ -n "$got" ]] && var_state="已更新"
          {
            echo "### record built main SHA"
            # 本仓库 public：summary 写摘要前缀，不写上游 SHA。
            echo "- sha: \`sha256:${SHA_DIGEST:0:12}…\`"
            echo "- 已构建标记: 每个 build job 各自一份 \`xn-built-<sha256>-<job>\`（下一轮 check 只跳完成的）"
            echo "- XN_LAST_MAIN_SHA: \`${var_state}\`（${used:-没有可写变量的 token}）"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$got" != "$SHA" ]]; then
            echo "::warning::XN_LAST_MAIN_SHA 没更新：XN_VARS_TOKEN 没配、XN_REPO_TOKEN 也写不了（多半是只授了 leptonyu/xn 的 fine-grained token）。已构建标记仍以各 build job 的 cache 标记 \`xn-built-<sha256>-<job>\` 为准，不影响下一轮跳过；要更新变量就配 XN_VARS_TOKEN（fine-grained，Variables: read/write），或把 XN_REPO_TOKEN 换成 classic PAT（repo scope）。"
          fi
