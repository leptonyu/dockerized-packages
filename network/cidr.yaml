  # eBPF 用：block_raw 去掉 non_public（私网 / 广播 / 文档 / special-purpose 等）。
  # xn_block_all 不用这条，保持原始 block_raw + scanner 的全量语义。
  - name: block
    input:
      - pipeline: block_raw
    ops:
      # 精确过滤：不能用 subtract_merge，否则稀疏的 block 会被合并成大片公网段。
      - op: subtract
        subtract:
          source: non_public
    output:
      file: xn_block.txt

  # allow = Cloudflare + CloudFront origin-facing。机器上 inbound_jail 的
  # allow_cidrs_file 就是这个并集（Terraform 的 cidr_allow.cf / .cft 再 merge），
  # 这里直接产出合并后的一份，消费端不用再自己 union。
  - name: cf
    input:
      - source: cloudflare

  - name: cft
    input:
      - source: aws
        aws:
          service: CLOUDFRONT_ORIGIN_FACING

  - name: allow
    input:
      - pipeline: cf
      - pipeline: cft
    output:
      file: xn_allow.txt
