# cidr pipeline：生成 xn_block / xn_cn / xn_fake / xn_us / xn_vpn / xn_allow
#
# 迁移自 machine/modules/network/cidr.yaml，输出名沿用原来的 xn_* 格式：
#   * non_public -> 非公网源（private_ranges + IPv6 special-use），不落文件；
#   * block_raw  -> xn_block_raw.txt（原始 block，仅给 xn_block_all 合并用）；
#   * block      -> xn_block.txt（block_raw 精确 subtract non_public，eBPF 用）；
#   * cn_us      -> xn_cn.txt（cn ∩ us，us 用过滤前的中间层，保持 machine 语义）；
#   * fake       -> xn_fake.txt；
#   * us_public  -> us 精确 subtract non_public（不落文件）；
#   * xn_us      -> xn_us.txt（us_public + fake；先过滤中间层，fake 直接合并）；
#   * xn_vpn    -> xn_vpn.txt（xn_us + 192.160.0.0/11 + 10.78.0.0/15）；
#   * allow     -> xn_allow.txt（Cloudflare + CloudFront origin-facing）。
# zone probe 不迁；本文件只负责纯 CIDR 输出。
#
# 内置源: country_asn, aws, github, google, cloudflare, private_ranges
# Usage: cidr --pipeline=cidr.yaml [--pipeline-output=NAME] [--pipeline-list]

pipeline:
  - name: cn
    input:
      - source: country_asn
        country_asn:
          cc: [CN]
      - source: private_ranges

  # 非公网地址：private_ranges 覆盖 RFC1918 / loopback / link-local / CGNAT /
  # 文档段 / benchmark / multicast / reserved / ULA / link-local v6 / multicast v6；
  # 这里补 IANA IPv6 special-purpose 里不在 private_ranges 的部分。
  # 用途：xn_block / us_public 的精确 subtract；不会给 xn_block_all 用。
  - name: non_public
    input:
      - source: private_ranges
      - source: inline
        inline:
          content: |
            ::ffff:0:0/96
            64:ff9b::/96
            64:ff9b:1::/48
            100::/64
            2001::/32
            2001:2::/48
            2001:10::/28
            2001:20::/28
            2001:db8::/32
            2002::/16
            3fff::/20
            5f00::/16

