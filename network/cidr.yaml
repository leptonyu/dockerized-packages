            - "AS36561"   # Youtube
          cc_exclude: [CN]
      - source: aws
        aws:
          exclude-region: cn
      - source: github
      - source: cloudflare
      - source: google
      - source: country_asn
        country_asn:
          asn:
            - "AS714"     # Apple HK
            - "AS20940"   # Akamai HK
            - "AS16625"   # Akamai HK
            - "AS8075"    # Microsoft HK
            #- "AS31898"   # Oracle
            #- "AS16509"   # Amazon
          cc: [HK, JP, SG]
    ops:
      - op: subtract_merge
        subtract_merge:
          source: cn
      - op: shrink_small_nets

  # xn_us 的过滤放在中间层：先把 us 里的 non_public 去掉，再直接并 fake。
  # fake 本身是 198.18.0.0/15 / fc00::/18（非公网），必须在过滤之后相加。
  - name: us_public
    input:
      - pipeline: us
    ops:
      # 这里必须用精确 subtract：subtract_merge 会把稀疏区间合并成更大的公网段，
      # 对「只保留公网」是过度放行。us 的 cn 减法仍保持原 pipeline 的 subtract_merge。
      - op: subtract
        subtract:
          source: non_public

  - name: fake
    input:
      - source: inline
        inline:
          content: |
            198.18.0.0/15
            fc00::/18
    output:
      file: xn_fake.txt

  - name: xn_us
    input:
      - pipeline: us_public
      - pipeline: fake
    output:
      file: xn_us.txt

  - name: cn_us
    input:
      - pipeline: cn
    ops:
      - op: intersect
        intersect:
          source: us
    output:
      file: xn_cn.txt

  - name: xn_vpn
    input:
      - pipeline: xn_us
      - source: inline
        inline:
          content: |
            192.160.0.0/11
            10.78.0.0/15
    output:
      file: xn_vpn.txt

